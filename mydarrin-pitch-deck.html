    en: {

      tari: 'Active countries', runda: 'Open round', tinta: 'Round target', progres: 'Raised from target', fara_runda: 'No public round is open right now.',
      inv_titlu: 'Indicators for investors', comenzi_total: 'Completed orders', comenzi_luna: 'Completed orders this month',
      parteneri_activi: 'Active partners', gmv: 'Order value (GMV)', venit: 'Platform revenue', take: 'Average commission (take rate)',
      evolutie: 'Completed orders per month · last 12 months', inv_doar: 'The financial indicators and the monthly trend are available to investors with a verified identity.',
      inapoi_prognoza: '← Back to the forecast', venit_partial: 'Revenue includes only the orders with a known commission.', live_eroare: 'This data cannot be loaded right now.',
      se_incarca_live: 'Loading the real data…', comenzi: 'orders',
    },
  };
  var LANG_KEY = 'myd_lang_v1';
  var LIMBI = ['ro', 'en', 'bg', 'de', 'el', 'fr', 'tr'];
  var $ = function (id) { return document.getElementById(id); };
  var stare = { limba: 'en', deck: null, payload: null, cerere: 0, mod: 'prognoza', vedere: 'mesaj', live: null };

  function limbaPagina() {
    var l = (window.MYD_I18N && window.MYD_I18N.lang) || (function () { try { return localStorage.getItem(LANG_KEY); } catch (e) { return null; } })() || 'en';
    l = String(l).slice(0, 2).toLowerCase();
    return LIMBI.indexOf(l) === -1 ? 'en' : l;
  }
  var limbaDeck = function (l) { return l === 'ro' ? 'ro' : 'en'; };
  var T = function () { return CHROME[limbaDeck(stare.limba)]; };
  var esc = function (s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; };

  function aplicaTexte() {
    var t = T();
    document.title = t.titlu;
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = t[el.getAttribute('data-t')]; });
    document.querySelectorAll('[data-t-aria]').forEach(function (el) { el.setAttribute('aria-label', t[el.getAttribute('data-t-aria')]); el.title = t[el.getAttribute('data-t-aria')]; });
    $('pd-comutator').setAttribute('aria-label', t.comutator);
    $('pd-limba').value = stare.limba;
  }

  // Sesiunea (dacă există): investitorii cu KYC aprobat primesc deck-ul complet.
  async function token() {
    for (var i = 0; i < 30 && !window.supabaseClient; i++) await new Promise(function (r) { setTimeout(r, 100); });
    try {
      var r = window.supabaseClient && await window.supabaseClient.auth.getSession();
      return (r && r.data && r.data.session && r.data.session.access_token) || null;
    } catch (e) { return null; }
  }

  // Ce se vede: modul live, sau (în prognoză) mesajul ori deck-ul.
  function aplicaMod() {
    var live = stare.mod === 'live';
    $('pd-live').hidden = !live;
    $('pd-mesaj').hidden = live || stare.vedere !== 'mesaj';
    $('pd-deck').hidden = live || stare.vedere !== 'deck';
    $('pd-nav').hidden = live || stare.vedere !== 'deck';
    $('pd-prezinta').hidden = live || stare.vedere !== 'deck';
    $('pd-mod-prognoza').setAttribute('aria-pressed', live ? 'false' : 'true');
    $('pd-mod-live').setAttribute('aria-pressed', live ? 'true' : 'false');
  }
  function arataMesaj(html) {
    $('pd-mesaj').innerHTML = html;
    stare.vedere = 'mesaj';
    aplicaMod();
  }
  function seteazaMod(mod) {
    stare.mod = mod;
    aplicaMod();
    if (mod === 'live') incarcaLive();
    window.scrollTo(0, 0);
  }

  async function incarca() {
    var nr = ++stare.cerere;
    var l = limbaDeck(stare.limba);
    arataMesaj('<p>' + esc(T().se_incarca) + '</p>');
    try {
      var tok = await token();
      var r = await fetch('/api/public/pitch-deck?limba=' + encodeURIComponent(stare.limba), { headers: tok ? { Authorization: 'Bearer ' + tok } : {} });
      var j = await r.json().catch(function () { return null; });
      if (nr !== stare.cerere) return;
      if (!r.ok || !j || !j.ok) throw new Error('http ' + r.status);
      stare.payload = j;
      if (j.stare === 'in_pregatire' || !j.deck) {
        if (stare.deck) { stare.deck.distruge(); stare.deck = null; }
        arataMesaj('<h1 data-in-pregatire>' + esc(T().pregatire_t) + '</h1><p>' + esc(T().pregatire_p) + '</p>' +

      }
      deseneaza(l);
    } catch (e) {
      if (nr !== stare.cerere) return;
      console.error('[pitch-deck]', e);
      arataMesaj('<h1>' + esc(T().eroare_t) + '</h1><p>' + esc(T().eroare_p) + '</p><button type="button" class="pd-cta" id="pd-reincearca">' + esc(T().reincearca) + '</button>');
      $('pd-reincearca').onclick = incarca;

  function deseneaza(l) {
    if (stare.deck) stare.deck.distruge();
    stare.vedere = 'deck';
    aplicaMod();
    stare.deck = window.MDPitchDeck.creeaza($('pd-deck-slideuri'), {
      payload: stare.payload, limba: l, hash: true, urlRunda: '/mydarrin-investitori#runda',
      // „Vezi cifrele reale →” de pe slide-urile 10, 12, 17, 18
      onLive: function () { seteazaMod('live'); },
      onSchimbare: function (i, total) {
        prez.laSchimbare(i, total);
        $('pd-contor').textContent = (i + 1) + ' / ' + total;
        $('pd-progres').style.width = ((i + 1) / total * 100) + '%';
        $('pd-inapoi-slide').disabled = i === 0;
        $('pd-inainte-slide').disabled = i === total - 1;

    });
    document.dispatchEvent(new CustomEvent('mdpd:gata', { detail: { stare: stare.payload.stare, limba: l } }));

  // /api/public/runda-curenta (progresul doar dacă runda îl afișează). Pentru
  // investitorii cu KYC aprobat: /api/investitori/indicatori și
  // /api/investitori/evolutie-lunara. Fără date → „Încă nu sunt date suficiente”.
  async function json(url, tok) {
    try {
      var r = await fetch(url, { headers: tok ? { Authorization: 'Bearer ' + tok } : {} });
      var j = await r.json().catch(function () { return null; });
      return { status: r.status, ok: r.ok && !!j && j.ok !== false, j: j };
    } catch (e) { return { status: 0, ok: false, j: null }; }
  }
  async function incarcaLive() {
    if (stare.live && stare.live.gata) return randeazaLive();
    $('pd-live').innerHTML = '<p>' + esc(T().se_incarca_live) + '</p>';
    var tok = await token();
    var r = await Promise.all([
      json('/api/public/statistici-homepage'), json('/api/public/tari-active'), json('/api/public/runda-curenta'),
      tok ? json('/api/investitori/indicatori', tok) : null, tok ? json('/api/investitori/evolutie-lunara', tok) : null,
    ]);
    stare.live = { gata: true, la: new Date(), stat: r[0], tari: r[1], runda: r[2], ind: r[3], evo: r[4] };
    randeazaLive();
  }
  function locale() { return limbaDeck(stare.limba) === 'ro' ? 'ro-RO-u-nu-latn' : 'en-GB'; }
  function fmtData(d) { try { return new Intl.DateTimeFormat(locale(), { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Bucharest' }).format(new Date(d)); } catch (e) { return ''; } }
  function card(k, v, s, attr) {
    var gol = v == null;
    return '<div class="pd-card"' + (attr || '') + '><div class="k">' + esc(k) + '</div><div class="v' + (gol ? ' pd-gol' : '') + '"' + (gol ? ' data-insuficient' : '') + '>' + esc(gol ? T().insuficient : v) + '</div>' + (s ? '<div class="s">' + s + '</div>' : '') + '</div>';
  }
  function randeazaLive() {
    var t = T(), L = stare.live, l = limbaDeck(stare.limba), F = window.MDPitchDeck;
    var nr = function (v) { return v > 0 ? F.formatNumar(v, l, 0) : null; };
    var st = L.stat.ok ? L.stat.j : null;
    var tari = L.tari.ok && Array.isArray(L.tari.j.tari) ? L.tari.j.tari : [];
    var nume = function (c) { try { return new Intl.DisplayNames([l === 'ro' ? 'ro' : 'en'], { type: 'region' }).of(c.tara_cod) || c.tara_nume; } catch (e) { return c.tara_nume || c.tara_cod; } };
    var r = L.runda.ok ? L.runda.j.runda : null;
    var html = '<div class="pd-live-cap"><div><h1>' + esc(t.live_titlu) + '</h1><p>' + esc(t.live_sub) + '</p></div>' +
      '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px"><span class="pd-real" data-real>● ' + esc(t.live_titlu) + '</span>' +
      '<span style="font-size:12.5px;color:rgba(255,255,255,.65)" data-actualizat>' + esc(t.actualizat) + ' ' + esc(fmtData(L.la)) + '</span></div></div>';
    html += '<div class="pd-grila">' +
      card(t.clienti, st ? nr(st.clienti_activi) : null, null, ' data-live="clienti"') +
      card(t.parteneri, st ? nr(st.parteneri_verificati) : null, null, ' data-live="parteneri"') +
      card(t.tari, tari.length ? String(tari.length) : null, tari.length ? esc(tari.map(nume).join(' · ')) : null, ' data-live="tari"') + '</div>';
    html += '<div class="pd-sectiune">' + esc(t.runda) + '</div>';
    if (r) {
      var den = l === 'ro' ? r.denumire_ro : r.denumire_en;
      var per = [F.formatData(r.data_start, l), F.formatData(r.data_sfarsit, l)].filter(Boolean).join(' – ');
      html += '<div class="pd-grila">' + card(den, F.formatBani(r.suma_tinta, r.moneda, l), esc(t.tinta) + (per ? ' · ' + esc(per) : ''), ' data-live="runda"') +
        (r.progres ? card(t.progres, F.formatBani(r.progres.stranse, r.moneda, l), esc(F.formatProcent(r.progres.pct, l)) + '<div class="pd-bara-p"><div style="width:' + Math.min(100, Number(r.progres.pct) || 0) + '%"></div></div>', ' data-live="progres"') : '') + '</div>';
    } else html += '<p class="pd-nota" data-live="fara-runda">' + esc(t.fara_runda) + '</p>';
    html += '<div class="pd-sectiune">' + esc(t.inv_titlu) + ' <span class="pd-real">● ' + esc(t.live_titlu) + '</span></div>';
    if (L.ind && L.ind.ok) {
      var k = L.ind.j.indicatori || {}, m = L.ind.j.moneda;
      var bani = function (v) { return v > 0 && m ? F.formatBani(v, m, l) : null; };
      html += '<div class="pd-grila" data-live="investitori">' + card(t.comenzi_total, nr(k.comenzi_total)) + card(t.comenzi_luna, nr(k.comenzi_luna)) +
        card(t.parteneri_activi, nr(k.parteneri_activi)) + card(t.gmv, bani(k.gmv_total)) + card(t.venit, bani(k.revenue_total)) +
        card(t.take, k.take_rate_pct != null ? F.formatProcent(k.take_rate_pct, l) : null) + '</div>';
      if (L.ind.j.actualizat_la) html += '<p style="font-size:12px;color:rgba(255,255,255,.6);margin:-6px 0 12px">' + esc(t.actualizat) + ' ' + esc(fmtData(L.ind.j.actualizat_la)) + '</p>';
      html += '<div class="pd-sectiune">' + esc(t.evolutie) + '</div>' + graficLunar(L.evo, l, t);
    } else if (L.ind && L.ind.status >= 500) {
      html += '<p class="pd-nota">' + esc(t.live_eroare) + '</p>';
    } else {
      html += '<p class="pd-nota" data-live="doar-investitori">' + esc(t.inv_doar) + ' <a href="/mydarrin-investitori">' + esc(t.investitori) + ' →</a></p>';
    }
    html += '<p style="margin-top:18px"><button type="button" class="pd-link" id="pd-live-inapoi">' + esc(t.inapoi_prognoza) + '</button></p>';
    $('pd-live').innerHTML = html;
    $('pd-live-inapoi').onclick = function () { seteazaMod('prognoza'); };
  }
  function graficLunar(evo, l, t) {
    if (!evo || !evo.ok) return '<p class="pd-nota">' + esc(evo && evo.status === 403 ? t.inv_doar : t.live_eroare) + '</p>';
    var luni = evo.j.luni || [];
    if (!evo.j.total_comenzi) return '<p class="pd-nota" data-insuficient data-live="evolutie">' + esc(t.insuficient) + '</p>';
    var W = 720, H = 220, jos = 30, sus = 20, max = Math.max.apply(null, luni.map(function (x) { return x.comenzi; }).concat([1]));
    var pas = W / luni.length, lat = pas * 0.6;
    var lunaScurt = function (iso) { try { return new Intl.DateTimeFormat(locale(), { month: 'short', timeZone: 'UTC' }).format(new Date(iso + '-01T00:00:00Z')); } catch (e) { return iso; } };
    var bare = luni.map(function (x, i) {
      var h = (x.comenzi / max) * (H - jos - sus), cx = pas * i + pas / 2;
      return '<rect x="' + (cx - lat / 2).toFixed(1) + '" y="' + (H - jos - h).toFixed(1) + '" width="' + lat.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="3" fill="#0BA39A"><title>' + esc(x.luna + ': ' + x.comenzi + ' ' + t.comenzi) + '</title></rect>' +
        (x.comenzi ? '<text x="' + cx.toFixed(1) + '" y="' + (H - jos - h - 5).toFixed(1) + '" text-anchor="middle">' + x.comenzi + '</text>' : '') +
        '<text x="' + cx.toFixed(1) + '" y="' + (H - 10) + '" text-anchor="middle">' + esc(lunaScurt(x.luna)) + '</text>';
    }).join('');
    return '<div class="pd-card pd-grafic-l" data-live="evolutie"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(t.evolutie) + '">' + bare + '</svg>' +
      (evo.j.venit_complet === false ? '<div class="s">' + esc(t.venit_partial) + '</div>' : '') + '</div>';
  }

  // Schimbarea limbii din antet: deck-ul se schimbă fără reîncărcarea paginii.
  function schimbaLimba(l) {
    if (LIMBI.indexOf(l) === -1 || l === stare.limba) return;
    var inainte = limbaDeck(stare.limba);
    stare.limba = l;
    try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
    document.documentElement.lang = l;
    aplicaTexte();
    prez.texte();
    if (limbaDeck(l) !== inainte || !stare.payload) incarca();
    if (stare.live && stare.live.gata && limbaDeck(l) !== inainte) randeazaLive();
  }

  $('pd-limba').addEventListener('change', function (e) { schimbaLimba(e.target.value); });
  $('pd-mod-prognoza').addEventListener('click', function () { seteazaMod('prognoza'); });
  $('pd-mod-live').addEventListener('click', function () { seteazaMod('live'); });
  $('pd-inapoi-slide').addEventListener('click', function () { stare.deck && stare.deck.anterior(); });
  $('pd-inainte-slide').addEventListener('click', function () { stare.deck && stare.deck.urmator(); });
  // ── Modurile de prezentare (11-K3): meniul „▶ Prezintă” ─────────
  var prez = window.MDPrezentare.ataseaza({
    buton: $('pd-prezinta'), scena: $('pd-deck'),
    deck: function () { return stare.deck; },
    limba: function () { return limbaDeck(stare.limba); },
    stareMod: function (mod) {
      var t = window.MDPrezentare.TEXTE[limbaDeck(stare.limba)];
      if (mod === 'prezentator') return t.motiv_admin;
      return null;
    },
  });
  document.addEventListener('keydown', function (e) {
    if (!stare.deck || stare.mod !== 'prognoza' || $('pd-deck').hidden || e.altKey || e.ctrlKey || e.metaKey) return;
    var tag = (e.target && e.target.tagName) || '';
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(tag)) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); stare.deck.urmator(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); stare.deck.anterior(); }
    else if (e.key === 'Home') { e.preventDefault(); stare.deck.mergiLa(0); }
    else if (e.key === 'End') { e.preventDefault(); stare.deck.mergiLa(stare.deck.total - 1); }
  });
  window.addEventListener('hashchange', function () {
    var m = String(location.hash).match(/^#slide-(\d+)$/);
    if (m && stare.deck) stare.deck.mergiLa(Number(m[1]) - 1);
  });

  stare.limba = limbaPagina();
  aplicaTexte();
  $('pd-comutator').hidden = false;
  incarca();
})();
</script>
</body>
</html>
