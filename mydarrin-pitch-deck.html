<style>

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:#16213A;color:#fff;font-family:'Helvetica World','Helvetica Neue',Arial,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#pd-app{min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
.pd-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(22,33,58,.94);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.08);flex-wrap:wrap}
.pd-top a.pd-inapoi{color:rgba(255,255,255,.75);font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
.pd-top a.pd-inapoi:hover{color:#fff}
.pd-spatiu{flex:1}
.pd-comutator{display:inline-flex;border:1px solid rgba(255,255,255,.2);border-radius:10px;overflow:hidden}
.pd-comutator button{background:none;border:0;color:rgba(255,255,255,.75);font:700 12.5px inherit;font-family:inherit;padding:8px 14px;cursor:pointer}
.pd-comutator button[aria-pressed="true"]{background:#0BA39A;color:#fff}
.pd-select{background:#0F1A2F;color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:9px;padding:7px 8px;font:600 12.5px inherit;font-family:inherit}
.pd-btn-ico{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:9px;height:34px;min-width:34px;padding:0 10px;cursor:pointer;font:700 12.5px inherit;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.pd-btn-ico:disabled{opacity:.35;cursor:default}
.pd-btn-ico:focus-visible,.pd-comutator button:focus-visible,.pd-select:focus-visible{outline:2px solid #F08120;outline-offset:2px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 16px}
#pd-deck{width:min(100%,calc((100svh - 150px) * 16 / 9));max-width:1600px}
.pd-nav{position:sticky;bottom:0;z-index:20;display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 16px;background:rgba(22,33,58,.94);backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,.08)}
.pd-contor{font-size:13px;font-weight:700;color:rgba(255,255,255,.8);font-variant-numeric:tabular-nums;min-width:64px;text-align:center}
.pd-bara{flex:0 1 320px;height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.pd-bara div{height:100%;background:linear-gradient(90deg,#0BA39A,#F08120);transition:width .3s ease}
.pd-mesaj{max-width:640px;text-align:center;padding:40px 20px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(255,255,255,.04)}
.pd-mesaj h1{font-size:clamp(22px,4vw,32px);margin:0 0 10px}
.pd-mesaj p{color:rgba(255,255,255,.72);line-height:1.6;margin:0 0 18px;font-size:15px}
.pd-cta{display:inline-flex;align-items:center;gap:6px;background:#F08120;color:#fff;border:0;border-radius:11px;padding:12px 22px;font:800 14px inherit;font-family:inherit;text-decoration:none;cursor:pointer}
#pd-deck:fullscreen{width:min(100vw,calc(100vh * 16 / 9));background:#16213A;display:flex;align-items:center}
@media (max-width:720px){
  main{padding:0;justify-content:flex-start}
  #pd-deck{width:100%}
  .pd-top{gap:8px;padding:8px 12px}
  .pd-titlu{display:none}
  #pd-ecran{display:none!important}
  .pd-bara{display:none}
  .pd-mesaj{margin:20px 16px}
}

<body>
<div id="pd-app" data-i18n-skip>
  <header class="pd-top">
    <a class="pd-inapoi" href="/mydarrin-investitori" data-t="inapoi"></a>
    <strong class="pd-titlu" style="font-size:13px;color:rgba(255,255,255,.55)">My Darrin · Pitch deck</strong>
    <span class="pd-spatiu"></span>
    <div class="pd-comutator" role="group" id="pd-comutator" hidden>
      <button type="button" id="pd-mod-prognoza" aria-pressed="true" data-t="prognoza"></button>
      <button type="button" id="pd-mod-live" aria-pressed="false" data-t="live"></button>
    </div>
    <select class="pd-select" id="pd-limba" data-t-aria="limba">
      <option value="ro">Română</option><option value="en">English</option><option value="bg">Български</option>
      <option value="de">Deutsch</option><option value="el">Ελληνικά</option><option value="fr">Français</option><option value="tr">Türkçe</option>
    </select>
    <button type="button" class="pd-btn-ico" id="pd-ecran" data-t-aria="ecran" hidden>⛶</button>
  </header>
  <main id="pd-main" aria-live="polite">
    <div id="pd-mesaj" class="pd-mesaj" hidden></div>
    <div id="pd-deck" hidden></div>
    <div id="pd-live" hidden></div>
  </main>
  <nav class="pd-nav" id="pd-nav" hidden>
    <button type="button" class="pd-btn-ico" id="pd-inapoi-slide" data-t-aria="anterior">←</button>
    <div class="pd-bara" aria-hidden="true"><div id="pd-progres" style="width:0"></div></div>
    <span class="pd-contor" id="pd-contor" aria-live="polite"></span>
    <button type="button" class="pd-btn-ico" id="pd-inainte-slide" data-t-aria="urmator">→</button>
  </nav>
</div>

<script type="module" src="lib/supabaseClient.js"></script>
<script src="/pitch-deck-render.js"></script>
<script>
(function () {
  'use strict';
  // Textele paginii: RO pentru română, EN pentru celelalte limbi (ca deck-ul).
  var CHROME = {
    ro: {
      titlu: 'Pitch deck · My Darrin', inapoi: '← Investitori', prognoza: 'Prognoză', live: 'Live', limba: 'Limba', ecran: 'Ecran complet',
      anterior: 'Slide-ul anterior', urmator: 'Slide-ul următor', comutator: 'Prognoză sau cifre reale',
      pregatire_t: 'Pitch deck în pregătire', pregatire_p: 'Pitch deck-ul My Darrin e în curs de verificare și va fi publicat după aprobare.',
      pregatire_live: 'Vezi cifrele reale din platformă', eroare_t: 'Pitch deck-ul nu se poate încărca acum', eroare_p: 'A apărut o problemă la încărcare. Încearcă din nou.', reincearca: 'Reîncearcă',
      se_incarca: 'Se încarcă pitch deck-ul…', investitori: 'Pagina Investitori',
    },
    en: {
      titlu: 'Pitch deck · My Darrin', inapoi: '← Investors', prognoza: 'Forecast', live: 'Live', limba: 'Language', ecran: 'Full screen',
      anterior: 'Previous slide', urmator: 'Next slide', comutator: 'Forecast or real figures',
      pregatire_t: 'Pitch deck in preparation', pregatire_p: 'The My Darrin pitch deck is being reviewed and will be published once approved.',
      pregatire_live: 'See the real platform figures', eroare_t: 'The pitch deck cannot be loaded right now', eroare_p: 'Something went wrong while loading. Please try again.', reincearca: 'Try again',
      se_incarca: 'Loading the pitch deck…', investitori: 'Investors page',
    },
  };
  var LANG_KEY = 'myd_lang_v1';
  var LIMBI = ['ro', 'en', 'bg', 'de', 'el', 'fr', 'tr'];
  var $ = function (id) { return document.getElementById(id); };
  var stare = { limba: 'en', deck: null, payload: null, cerere: 0, mod: 'prognoza' };

  function limbaPagina() {
    var l = (window.MYD_I18N && window.MYD_I18N.lang) || (function () { try { return localStorage.getItem(LANG_KEY); } catch (e) { return null; } })() || 'en';
    l = String(l).slice(0, 2).toLowerCase();
    return LIMBI.indexOf(l) === -1 ? 'en' : l;
  }
  var limbaDeck = function (l) { return l === 'ro' ? 'ro' : 'en'; };
  var T = function () { return CHROME[limbaDeck(stare.limba)]; };
  var esc = function (s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; };

  function aplicaTexte() {
    var t = T();
    document.title = t.titlu;
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = t[el.getAttribute('data-t')]; });
    document.querySelectorAll('[data-t-aria]').forEach(function (el) { el.setAttribute('aria-label', t[el.getAttribute('data-t-aria')]); el.title = t[el.getAttribute('data-t-aria')]; });
    $('pd-comutator').setAttribute('aria-label', t.comutator);
    $('pd-limba').value = stare.limba;
  }

  // Sesiunea (dacă există): investitorii cu KYC aprobat primesc deck-ul complet.
  async function token() {
    for (var i = 0; i < 30 && !window.supabaseClient; i++) await new Promise(function (r) { setTimeout(r, 100); });
    try {
      var r = window.supabaseClient && await window.supabaseClient.auth.getSession();
      return (r && r.data && r.data.session && r.data.session.access_token) || null;
    } catch (e) { return null; }
  }

  function arataMesaj(html) {
    $('pd-mesaj').innerHTML = html;
    $('pd-mesaj').hidden = false;
    $('pd-deck').hidden = true;
    $('pd-nav').hidden = true;
    $('pd-ecran').hidden = true;
  }

  async function incarca() {
    var nr = ++stare.cerere;
    var l = limbaDeck(stare.limba);
    arataMesaj('<p>' + esc(T().se_incarca) + '</p>');
    try {
      var tok = await token();
      var r = await fetch('/api/public/pitch-deck?limba=' + encodeURIComponent(stare.limba), { headers: tok ? { Authorization: 'Bearer ' + tok } : {} });
      var j = await r.json().catch(function () { return null; });
      if (nr !== stare.cerere) return;
      if (!r.ok || !j || !j.ok) throw new Error('http ' + r.status);
      stare.payload = j;
      if (j.stare === 'in_pregatire' || !j.deck) {
        if (stare.deck) { stare.deck.distruge(); stare.deck = null; }
        arataMesaj('<h1 data-in-pregatire>' + esc(T().pregatire_t) + '</h1><p>' + esc(T().pregatire_p) + '</p>' +
          '<a class="pd-cta" href="/mydarrin-investitori">' + esc(T().investitori) + '</a>');
        document.dispatchEvent(new CustomEvent('mdpd:gata', { detail: { stare: 'in_pregatire', limba: l } }));
        return;
      }
      deseneaza(l);
    } catch (e) {
      if (nr !== stare.cerere) return;
      console.error('[pitch-deck]', e);
      arataMesaj('<h1>' + esc(T().eroare_t) + '</h1><p>' + esc(T().eroare_p) + '</p><button type="button" class="pd-cta" id="pd-reincearca">' + esc(T().reincearca) + '</button>');
      $('pd-reincearca').onclick = incarca;
    }
  }

  function deseneaza(l) {
    if (stare.deck) stare.deck.distruge();
    $('pd-mesaj').hidden = true;
    $('pd-deck').hidden = false;
    $('pd-nav').hidden = false;
    $('pd-ecran').hidden = !document.fullscreenEnabled;
    stare.deck = window.MDPitchDeck.creeaza($('pd-deck'), {
      payload: stare.payload, limba: l, hash: true, urlRunda: '/mydarrin-investitori#runda',
      onSchimbare: function (i, total) {
        $('pd-contor').textContent = (i + 1) + ' / ' + total;
        $('pd-progres').style.width = ((i + 1) / total * 100) + '%';
        $('pd-inapoi-slide').disabled = i === 0;
        $('pd-inainte-slide').disabled = i === total - 1;
      },
    });
    document.dispatchEvent(new CustomEvent('mdpd:gata', { detail: { stare: stare.payload.stare, limba: l } }));
  }

  // Schimbarea limbii din antet: deck-ul se schimbă fără reîncărcarea paginii.
  function schimbaLimba(l) {
    if (LIMBI.indexOf(l) === -1 || l === stare.limba) return;
    var inainte = limbaDeck(stare.limba);
    stare.limba = l;
    try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
    document.documentElement.lang = l;
    aplicaTexte();
    if (limbaDeck(l) !== inainte || !stare.payload) incarca();
  }

  $('pd-limba').addEventListener('change', function (e) { schimbaLimba(e.target.value); });
  $('pd-inapoi-slide').addEventListener('click', function () { stare.deck && stare.deck.anterior(); });
  $('pd-inainte-slide').addEventListener('click', function () { stare.deck && stare.deck.urmator(); });
  $('pd-ecran').addEventListener('click', function () {
    if (document.fullscreenElement) document.exitFullscreen(); else if ($('pd-deck').requestFullscreen) $('pd-deck').requestFullscreen().catch(function () {});
  });
  document.addEventListener('keydown', function (e) {
    if (!stare.deck || $('pd-deck').hidden || e.altKey || e.ctrlKey || e.metaKey) return;
    var tag = (e.target && e.target.tagName) || '';
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(tag)) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); stare.deck.urmator(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); stare.deck.anterior(); }
    else if (e.key === 'Home') { e.preventDefault(); stare.deck.mergiLa(0); }
    else if (e.key === 'End') { e.preventDefault(); stare.deck.mergiLa(stare.deck.total - 1); }
  });
  window.addEventListener('hashchange', function () {
    var m = String(location.hash).match(/^#slide-(\d+)$/);
    if (m && stare.deck) stare.deck.mergiLa(Number(m[1]) - 1);
  });

  stare.limba = limbaPagina();
  aplicaTexte();
  incarca();
})();
</script>
