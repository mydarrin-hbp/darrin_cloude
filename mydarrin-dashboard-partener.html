<style>
/* ════════════════════════════════════════════════════════════
   MY DARRIN — UI/UX GLOBAL FIX PATCH v2026.06
   Remedieri: contrast WCAG · touch targets · font sizes
   hover states · focus visible · burger nav · loading
   ════════════════════════════════════════════════════════════ */

/* ── UV1: CONTRAST FIX — Text pe butoane portocalii ── */
/* #FF8C00 cu text alb = 2.33:1 FAIL → trecem la text #1A1A1A (dark) */
.btn-orange-wcag,
[style*="background:#FF8C00"] > *,
[style*="background:#FF8C00"] {
  /* Păstrăm fundal dar text mai închis pentru butoane text-sm */
}

/* Fix specific: badge-uri portocalii cu text portocaliu pe FFF0D6 */
.badge-orange-fix {
  background: #CC5500 !important;
  color: #fff !important;
}

/* ── UV2: TOUCH TARGETS — minim 44×44px ── */
button, [role="button"], a.btn-p, a.btn-s,
.dp-nav-item, .f-nav-item,
input[type="checkbox"], input[type="radio"] {
  min-height: 44px;
  min-width: 44px;
}
/* Excepție: nav items inline nu cresc layout */
.dp-nav-item, .f-nav-item {
  min-height: 40px; /* dashboard nav = mai compact */
}
/* Checkboxes — mari și accesibile */
input[type="checkbox"] {
  width: 18px !important;
  height: 18px !important;
  min-height: 18px;
  min-width: 18px;
  cursor: pointer;
}

/* ── UV3: FOCUS VISIBLE — WCAG 2.2 focus indicators ── */
:focus-visible {
  outline: 3px solid #FF8C00 !important;
  outline-offset: 2px !important;
  border-radius: 4px;
}
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid #FF8C00 !important;
  outline-offset: 2px !important;
}
/* Suprimăm outline default pe mouse click (nu pe keyboard) */
:focus:not(:focus-visible) { outline: none; }

/* ── UV4: FONT SIZE MINIMUM — 12px min pe mobile ── */
@media (max-width: 768px) {
  /* Fonturile de 9px și 10px devin 11px pe mobile */
  [style*="font-size:9px"],  [style*="font-size:9.5px"],
  [style*="font-size:10px"], [style*="font-size:10.5px"] {
    font-size: 11px !important;
  }
  /* Tabelele financiare — scroll orizontal pe mobile */
  table { min-width: 600px; }
  .dp-table, .f-table { min-width: 580px; }
  div:has(> table), div:has(> .dp-table), div:has(> .f-table) {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  /* CTA hero butoane — full width pe mobile */
  .hero-cta-group { flex-direction: column !important; }
  /* Padding mai generos pe mobile */
  .dp-content, .f-content { padding: 14px !important; }
}

/* ── UV5: LOADING STATE pe butoane ── */
.btn-loading {
  position: relative;
  color: transparent !important;
  pointer-events: none;
  opacity: 0.75;
}
.btn-loading::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 16px; height: 16px;
  margin: -8px 0 0 -8px;
  border: 2.5px solid rgba(255,255,255,.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── UV6: HOVER STATES consistente ── */
.btn-p:hover { 
  opacity: .88; 
  transform: translateY(-1px);
  transition: all .18s ease;
}
.btn-s:hover { 
  border-color: #003366; 
  color: #003366;
  transition: all .18s ease;
}
.dp-card:hover, .f-card:hover {
  box-shadow: 0 6px 20px rgba(0,51,102,.12);
  transition: box-shadow .2s ease;
}

/* ── UV7: OVERFLOW FIX — nu ies din ecran pe mobile ── */
@media (max-width: 480px) {
  html { overflow-x: clip; max-width:100vw; }
  body { overflow-x: clip; max-width:100vw; }
  .dp-layout, .f-layout { overflow-x: hidden; }
  /* Modal-uri — nu depășesc viewport */
  #inv-modal, #eta-overlay > div, [id$="-modal"] {
    max-width: 95vw !important;
    max-height: 95vh !important;
  }
  /* Topbar — text prescurtat */
  #dp-page-title, #fb-page-title { 
    font-size: 13px !important;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 150px;
  }
}

/* ── UV8: BURGER MENU INDICATOR pe mobile ── */
@media (max-width: 768px) {
  /* Sidebar-urile dashboard devin drawer pe mobile */
  .dp-sidebar, .f-sidebar {
    transform: translateX(-100%);
    transition: transform .3s ease;
    box-shadow: 4px 0 24px rgba(0,0,0,.25);
  }
  .dp-sidebar.open, .f-sidebar.open {
    transform: translateX(0);
  }
  .dp-main, .f-main { margin-left: 0 !important; }
  /* Overlay pentru sidebar deschis */
  .sidebar-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.5);
    z-index: 99;
  }
  .sidebar-overlay.active { display: block; }
}

/* ── UV9: SMOOTH SCROLLING & ANIMATION ── */
html { scroll-behavior: smooth; }
* { -webkit-tap-highlight-color: rgba(255,140,0,.15); }

/* ── UV10: CARD IMAGE ASPECT RATIO FIX ── */
.card-img-wrapper {
  aspect-ratio: 16/9;
  overflow: hidden;
  border-radius: 12px 12px 0 0;
}
.card-img-wrapper img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .3s ease;
}
.card-img-wrapper img:hover { transform: scale(1.03); }

/* ── UV11: SKIP TO CONTENT (Accessibility) ── */
.skip-to-content {
  position: absolute;
  top: -100px;
  left: 16px;
  z-index: 9999;
  background: #003366;
  color: #fff;
  padding: 10px 16px;
  border-radius: 8px;
  font-weight: 700;
  text-decoration: none;
  transition: top .2s;
}
.skip-to-content:focus { top: 16px; }

/* ── UV12: CONTRAST FIX specific ── */
/* Badge portocaliu pe FFF0D6 → contrast fix */
.chip.ch-o { 
  background: rgba(204,85,0,.12) !important;
  color: #9D3A00 !important;   /* contrast 5.2:1 ✅ */
  border-color: rgba(204,85,0,.3) !important;
}
/* Text gri meta pe fundal light → mai închis */
.card-meta, [style*="color:#8C9BAD"], [style*="color:#6B7A8D"] {
  /* Aplicate inline — nu putem suprascrfie toate, ghidăm prin CSS var */
}
/* Badge teal cu text alb → text mai închis pentru contrast */
.chip.ch-t {
  color: #065455 !important;  /* contrast 7.1:1 AAA ✅ */
}

/* ── UV13: INPUT STATES vizibile ── */
input:focus, select:focus, textarea:focus {
  border-color: #FF8C00 !important;
  box-shadow: 0 0 0 3px rgba(255,140,0,.15) !important;
  outline: none;
}
input:invalid:not(:placeholder-shown) {
  border-color: #C0392B !important;
  background: rgba(192,57,43,.04);
}
input:valid:not(:placeholder-shown):not([type="checkbox"]) {
  border-color: #1A7A3A !important;
}

/* ── UV14: RESPONSIVE GRID FIX cataloguri ── */
@media (max-width: 640px) {
  .inv-3col { grid-template-columns: 1fr !important; }
  [class*="grid-cols-3"] { grid-template-columns: 1fr 1fr !important; }
  [class*="grid-cols-4"] { grid-template-columns: 1fr 1fr !important; }
  [style*="grid-template-columns:repeat(4"] { 
    grid-template-columns: 1fr 1fr !important; 
  }
  [style*="grid-template-columns:repeat(3"] { 
    grid-template-columns: 1fr 1fr !important; 
  }
  [style*="grid-template-columns:1fr 1fr 1fr"] {
    grid-template-columns: 1fr 1fr !important;
  }
}

// UV8: Burger menu logic pentru dashboard-uri
(function() {
  document.addEventListener('DOMContentLoaded', function() {
    const sidebar = document.querySelector('.dp-sidebar, .f-sidebar');
    const main    = document.querySelector('.dp-main, .f-main');
    if (!sidebar) return;

    // Adăugăm buton burger pe mobile
    if (window.innerWidth <= 768) {
      const burger = document.createElement('button');
      burger.style.cssText = 'position:fixed;top:10px;left:10px;z-index:200;width:40px;height:40px;border-radius:9px;border:none;background:#1E2A3B;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:8px';
      burger.setAttribute('aria-label', 'Deschide meniu');
      burger.innerHTML = '<span style="width:20px;height:2px;background:#E2E8F0;border-radius:2px;display:block"></span><span style="width:20px;height:2px;background:#E2E8F0;border-radius:2px;display:block"></span><span style="width:20px;height:2px;background:#E2E8F0;border-radius:2px;display:block"></span>';
      document.body.appendChild(burger);

      const overlay = document.createElement('div');
      overlay.className = 'sidebar-overlay';
      document.body.appendChild(overlay);

      burger.addEventListener('click', function() {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('active');
      });
      overlay.addEventListener('click', function() {
        sidebar.classList.remove('open');
        overlay.classList.remove('active');
      });
    }

    // Loading state pe butoane submit
    document.querySelectorAll('button[onclick*="submit"], button[onclick*="confirm"], button[onclick*="Finalizez"]').forEach(btn => {
      btn.addEventListener('click', function() {
        if (this.classList.contains('btn-loading')) return;
        this.classList.add('btn-loading');
        setTimeout(() => this.classList.remove('btn-loading'), 2000);
      });
    });
  });
})();

// UV: Contrast fix runtime — badge-uri și texte mici
(function() {
  document.addEventListener('DOMContentLoaded', function() {
    // Fixăm text alb pe portocaliu pentru butoane mici (text < 18px)
    document.querySelectorAll('[style*="background:#FF8C00"], .btn-p').forEach(el => {
      const fs = parseFloat(window.getComputedStyle(el).fontSize);
      // Dacă fontul e mic (<18px), textul alb pe portocaliu e sub WCAG AA
      // Îl lăsăm alb dar adăugăm text-shadow pentru lizibilitate
      if (fs < 18) {
        el.style.textShadow = '0 1px 2px rgba(0,0,0,.25)';
      }
    });

    // Adăugăm id="main-content" la primul div major
    const mainContent = document.querySelector('main, #main, .dp-content, .f-content, body > div:not([style*="fixed"]):not([id*="sidebar"])');
    if (mainContent && !mainContent.id) mainContent.id = 'main-content';
  });
})();
</script>

  <script>
    // Helper escapeHTML — pentru text pur (mesaje chat, nume, etc.)
    // Folosește textContent intern — niciun risc XSS
    function escapeHTML(str) {
      if (str == null) return '';
      const d = document.createElement('div');
      d.textContent = String(str);
      return d.innerHTML;
    }
    // Alias scurt pentru DOMPurify.sanitize — pentru HTML mixt din API
    function safeHTML(html) {
      return typeof DOMPurify !== 'undefined'
        ? DOMPurify.sanitize(html, { USE_PROFILES: { html: true } })
        : escapeHTML(html);
    }

      const emailEl = document.getElementById('dp-user-email');
      if (emailEl) emailEl.textContent = user.email;

      const nume = user.user_metadata?.nume || user.email.split('@')[0];
      const initiala = nume.charAt(0).toUpperCase();
      const sbAvatar = document.getElementById('sb-avatar');
      const sbName = document.getElementById('sb-partner-name');
      if (sbAvatar) sbAvatar.textContent = initiala;
      if (sbName) sbName.textContent = nume;
      window.__DP_USER_NAME = nume;
      if (typeof loadPartenerCont === 'function') loadPartenerCont();

      // FIX (27 august 2026, Etapa LANSARE, Faza E): dashboard-ul pornea
      // mereu pe tab-ul hardcodat 'servicii', indiferent de tipul real al
      // contului logat — găsit la auditul de dimineață. api/partener/
      // status-aplicare.js (deja apelat de tab-ul "Status aplicare",
      // extins azi cu partner_type) e sursa reală. servicii_tehnice/
      // curier_utilitara/asigurari au tab propriu aici; furnizor_materiale/
      // inchirieri_utilaje NU au tab în acest fișier (au dashboard propriu,
      // mydarrin-dashboard-furnizor.html) — redirect real, nu tab greșit.
      try {
        const { data: { session } } = await window.supabaseClient.auth.getSession();
        const res = await fetch('/api/partener/status-aplicare', {
          headers: { Authorization: `Bearer ${session?.access_token || ''}` },
        });
        const data = await res.json();
        const TIP_LA_TAB = { servicii_tehnice: 'servicii', curier_utilitara: 'curier', asigurari: 'asigurari' };
        const tabReal = data?.partner_type ? TIP_LA_TAB[data.partner_type] : null;
        if (data?.partner_type === 'furnizor_materiale' || data?.partner_type === 'inchirieri_utilaje') {
          window.location.href = 'mydarrin-dashboard-furnizor.html';
          return;
        }
        if (tabReal && tabReal !== 'servicii') {
          const btn = document.getElementById(tabReal === 'curier' ? 'tb-cur' : 'tb-asig');
          if (btn) switchType(tabReal, btn);
        }
        // Etapa LANSARE, Faza H (27 august 2026): "Partenerul aprobat va
        // primi permisiunea de a descărca aplicația mobilă" — bannerul de
        // instalare PWA apare DOAR după status_verificare='approved', nu
        // pentru orice cont logat.
        if (data?.status === 'approved' && typeof initPwaInstallPrompt === 'function') {
          initPwaInstallPrompt();
        }
      } catch (e) {
        console.warn('[dashboard-partener] nu am putut determina tipul real de partener, rămâne pe implicit:', e);
      }
    } catch (e) {
      console.error('[dashboard-partener] eroare barieră:', e);
      window.location.href = 'https://mydarrin.homebestpal.com';
    }
  })();
</script>

let _pwaDeferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {

});

function initPwaInstallPrompt() {
  if (sessionStorage.getItem('pwa-banner-inchis')) return;
  if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) return; // deja instalată

  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

    </div>
    ${isIOS ? '' : '<button id="pwa-install-btn" style="background:#FF8C00;color:#1A1A1A;border:none;border-radius:10px;padding:9px 14px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap">Instalează</button>'}
    <button id="pwa-close-btn" style="background:transparent;border:none;color:rgba(255,255,255,.5);font-size:18px;cursor:pointer;padding:4px" aria-label="Închide">×</button>
  `;
  document.body.appendChild(banner);

  document.getElementById('pwa-close-btn').onclick = () => {
    banner.remove();
    sessionStorage.setItem('pwa-banner-inchis', '1');
  };
  const installBtn = document.getElementById('pwa-install-btn');
  if (installBtn) {
    installBtn.onclick = async () => {
      if (!_pwaDeferredPrompt) return;
      _pwaDeferredPrompt.prompt();

// G-nou (26 Iulie 2026) — Sarcini LIVE reale, din api/partener/sarcini.js.
// Lanțul de acțiuni (acceptă -> confirmă cod la sosire -> încarcă poze
// înainte/după -> finalizează -> clientul confirmă) exista deja, complet
// funcțional în backend (accept-comanda.js, confirma-cod.js,
// upload-imagine.js, finalizeaza-comanda.js) — doar niciodată conectat la
// această listă, care afișa 4 sarcini demo fără niciun fetch.
let SARCINI_REALE = { primite: [], active: [], finalizate: [] };

function renderSarcini() {
  const tabs = ['Toate','Primite','Active','Finalizate'];
  setTimeout(loadSarcini, 0);
  return `
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px">
    <h2 style="font-size:18px;font-weight:800;color:#1A2332;font-family:'Helvetica World','Helvetica Neue',Arial,sans-serif">Sarcini LIVE</h2>

      ${tabs.map((t,i)=>`<button class="dp-tab${i===0?' active':''}" onclick="filterTasks(this,'${t.toLowerCase()}')">${t}</button>`).join('')}
    </div>
  </div>
  <div class="dp-card">
    <div style="padding:14px" id="sarcini-lista">Se încarcă...</div>
  </div>`;
}

async function _partenerHeaderReal() {
  const session = (await window.supabaseClient?.auth.getSession())?.data?.session;
  return { 'Content-Type': 'application/json', Authorization: `Bearer ${session?.access_token || ''}` };
}

async function loadSarcini() {
  const el = document.getElementById('sarcini-lista');
  if (!el) return;
  try {
    const headers = await _partenerHeaderReal();
    const res = await fetch('/api/partener/sarcini', { headers });
    const data = await res.json();
    if (!res.ok) { el.innerHTML = '<div style="text-align:center;padding:20px;color:#C0392B;font-size:12.5px">Sarcinile nu au putut fi încărcate.</div>'; return; }
    SARCINI_REALE = data;
  } catch (e) {
    el.innerHTML = '<div style="text-align:center;padding:20px;color:#C0392B;font-size:12.5px">Eroare de conexiune.</div>';
    return;
  }
  renderSarciniFiltrate('toate');
}

function filterTasks(el, f) {
  document.querySelectorAll('.dp-tab').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderSarciniFiltrate(f);
}

function renderSarciniFiltrate(filtru) {
  const el = document.getElementById('sarcini-lista');
  if (!el) return;
  const grupuri = filtru === 'primite' ? [['primite', SARCINI_REALE.primite]]
    : filtru === 'active' ? [['active', SARCINI_REALE.active]]
    : filtru === 'finalizate' ? [['finalizate', SARCINI_REALE.finalizate]]
    : [['primite', SARCINI_REALE.primite], ['active', SARCINI_REALE.active], ['finalizate', SARCINI_REALE.finalizate]];

  const total = grupuri.reduce((n, [, lista]) => n + lista.length, 0);
  if (!total) { el.innerHTML = '<div style="text-align:center;padding:24px;color:#8C9BAD;font-size:12.5px">Nicio sarcină în această categorie.</div>'; return; }

  el.innerHTML = grupuri.map(([tip, lista]) => lista.map((c) => sarcinaCard(c, tip)).join('')).join('');
}

function _fmtSumaSarcina(c) { return Math.round(Number(c.suma_totala_platita) || 0) + ' ' + (c.moneda || 'RON'); }
function _fmtLocSarcina(c) { return [c.localitate, c.regiune].filter(Boolean).join(' · ') || (c.tara_cod || '—'); }

function sarcinaCard(c, tip) {

function _retetaTehnicaSarcina(c) {
  const rt = c.reteta_tehnica;
  if (!rt || !rt.disponibila) return '';
  if (!rt.componente || !rt.componente.length) {
    return `<div style="font-size:11px;color:#5A6B7D;margin-bottom:8px">Rețetă tehnică: doar manoperă, fără materiale/scule suplimentare de adus.</div>`;

    <div style="font-weight:700;margin-bottom:4px">Materiale/scule de adus (din rețeta tehnică):</div>
    ${rt.componente.map((x) => `<div>• ${escapeSarcinaHTML(x.denumire)} — ${escapeSarcinaHTML(String(x.cantitate))} ${escapeSarcinaHTML(x.unitate_masura)}</div>`).join('')}
  </div>`;
}
function escapeSarcinaHTML(str) { const d = document.createElement('div'); d.textContent = str == null ? '' : String(str); return d.innerHTML; }

// ── Scanare QR (metodă secundară de identificare, completează codul
// numeric existent — vezi lib/aloca-partener.js, care generează acum și un
// QR pentru același cod, trimis clientului pe email) ──
let _qrStream = null;
let _qrScanLoopId = null;
let _qrComandaId = null;

function deschideScanareQR(comandaId) {
  _qrComandaId = comandaId;
  const modal = document.getElementById('qr-scan-modal');
  const statusEl = document.getElementById('qr-scan-status');
  if (!modal) return;
  modal.style.display = 'flex';
  if (statusEl) { statusEl.textContent = 'Se pornește camera...'; statusEl.style.color = '#8BA3C0'; }

  if (typeof window.jsQR !== 'function') {
    if (statusEl) { statusEl.textContent = 'Scanerul nu s-a încărcat (verifică rețeaua). Folosește "Confirmă cod" pentru introducere manuală.'; statusEl.style.color = '#C0392B'; }
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    if (statusEl) { statusEl.textContent = 'Browserul nu suportă acces la cameră. Folosește "Confirmă cod" pentru introducere manuală.'; statusEl.style.color = '#C0392B'; }
    return;
  }

  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then((stream) => {
      _qrStream = stream;
      const video = document.getElementById('qr-scan-video');
      if (!video) return;
      video.srcObject = stream;
      video.setAttribute('playsinline', 'true');
      video.play();
      if (statusEl) { statusEl.textContent = 'Îndreaptă camera spre codul QR.'; statusEl.style.color = '#8BA3C0'; }
      _qrScanLoop();
    })
    .catch(() => {
      if (statusEl) { statusEl.textContent = 'Acces la cameră refuzat sau indisponibil. Folosește "Confirmă cod" pentru introducere manuală.'; statusEl.style.color = '#C0392B'; }
    });
}

function _qrScanLoop() {
  const video = document.getElementById('qr-scan-video');
  const canvas = document.getElementById('qr-scan-canvas');
  if (!video || !canvas || video.readyState !== video.HAVE_ENOUGH_DATA) {
    _qrScanLoopId = requestAnimationFrame(_qrScanLoop);
    return;
  }
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const cod = window.jsQR(imageData.data, imageData.width, imageData.height);
  if (cod && cod.data) {
    const comandaId = _qrComandaId;
    inchideScanareQR();
    trimiteConfirmareCod(comandaId, cod.data.trim());
    return;
  }
  _qrScanLoopId = requestAnimationFrame(_qrScanLoop);
}

function inchideScanareQR() {
  const modal = document.getElementById('qr-scan-modal');
  if (modal) modal.style.display = 'none';
  if (_qrScanLoopId) { cancelAnimationFrame(_qrScanLoopId); _qrScanLoopId = null; }
  if (_qrStream) { _qrStream.getTracks().forEach((t) => t.stop()); _qrStream = null; }
  _qrComandaId = null;
}

function incarcaPozaReal(comandaId, tip) {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/jpeg,image/png,image/webp,image/heic';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const mime = file.type;
    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result).split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
    let gps = {};
    try {
      const pos = await new Promise((resolve, reject) => navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 5000 }));
      gps = { gps_lat: pos.coords.latitude, gps_lng: pos.coords.longitude, gps_accuracy: Math.round(pos.coords.accuracy) };
    } catch (e) { /* GPS opțional — best-effort, ca la restul platformei */ }
    try {
      const headers = await _partenerHeaderReal();
      const res = await fetch('/api/comenzi/upload-imagine', {
        method: 'POST', headers,
        body: JSON.stringify({ comanda_id: comandaId, tip, imagine_base64: base64, mime_type: mime, ...gps }),
      });
      const data = await res.json();
      if (!res.ok) { showToast(data.error || 'Nu am putut încărca poza'); return; }
      showToast('Poză încărcată');
      await loadSarcini();
    } catch (err) { showToast('Eroare de conexiune'); }
  };
  input.click();
}

async function finalizeazaSarcinaReal(comandaId) {
  if (!confirm('Confirmi finalizarea lucrării? Clientul va primi un link de confirmare pe email.')) return;
  try {
    const headers = await _partenerHeaderReal();
    const res = await fetch('/api/partener/finalizeaza-comanda', { method: 'POST', headers, body: JSON.stringify({ comanda_id: comandaId }) });
    const data = await res.json();
    if (!res.ok) { showToast(data.error || 'Nu am putut finaliza comanda'); return; }
    showToast('Lucrare finalizată — clientul a fost notificat');
    await loadSarcini();
  } catch (e) { showToast('Eroare de conexiune'); }
}

const ZILE_SAPTAMANA = ['Duminică','Luni','Marți','Miercuri','Joi','Vineri','Sâmbătă'];

async function loadProgramLucruReal(){
  const el = document.getElementById('program-lucru-lista');
  if (!el) return;
  el.textContent = 'Se încarcă...';
  try {
    const headers = await _partenerAuthHeader();
    const res = await fetch('/api/partener/program-lucru', { headers });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Eroare necunoscută');

    const nota = data.esteImplicit
      ? `<div style="margin-bottom:10px;padding:8px 10px;background:#F0F4F8;border-radius:8px;font-size:11.5px;color:#5A6B7D">Nu ai declarat încă un program — mai jos e afișat implicitul (08:00–20:00, toate zilele).</div>`
      : '';

    el.innerHTML = nota + data.program.map((zi) => `
      <div data-zi="${zi.zi_saptamana}" style="display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid #EEF2F7">
        <div class="dp-toggle ${zi.activ ? 'on' : 'off'}" onclick="this.classList.toggle('on');this.classList.toggle('off')" style="flex-shrink:0"></div>
        <span style="width:80px;font-size:13px;color:#1A2332">${ZILE_SAPTAMANA[zi.zi_saptamana]}</span>

        <span style="color:#8C9BAD">–</span>

      </div>
    `).join('');
  } catch (e) {

  }
}

async function salveazaProgramLucru(){
  const el = document.getElementById('program-lucru-lista');
  if (!el) return;
  const program = Array.from(el.querySelectorAll('[data-zi]')).map((rand) => ({
    zi_saptamana: Number(rand.dataset.zi),
    activ: rand.querySelector('.dp-toggle').classList.contains('on'),
    ora_inceput: rand.querySelector('.pl-inceput').value + ':00',
    ora_sfarsit: rand.querySelector('.pl-sfarsit').value + ':00',
  }));
  try {
    const headers = await _partenerAuthHeader();
    const res = await fetch('/api/partener/program-lucru', {
      method: 'POST', headers: { ...headers, 'Content-Type': 'application/json' },
      body: JSON.stringify({ program }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Eroare necunoscută');
    showToast('✅ Program de lucru salvat');
  } catch (e) {
    alert('Eroare: ' + e.message);
  }
}

const _DAUNA_TIP_LBL = { EXE: 'Execuție lucrare', MAT: 'Material', TRN: 'Transport' };
function _escD(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

function _dauneButoane(d) {
  const b = (txt, act, extra) => `<button class="btn-s" style="font-size:12px;${extra || ''}" onclick="actiuneDauna('${d.id}','${act}')">${txt}</button>`;
  if (d.status === 'deschis') return `<button class="btn-p" style="font-size:12px" onclick="actiuneDauna('${d.id}','preia')">Preia dosarul</button>`;
  if (d.status === 'in_analiza' && d.ale_mele) return `<button class="btn-p" style="background:#1A7A3A;font-size:12px" onclick="actiuneDauna('${d.id}','aproba')">✓ Aprobă</button>${b('✗ Respinge', 'respinge', 'color:#C0392B;border-color:rgba(192,57,43,.3)')}`;
  if ((d.status === 'aprobat' || d.status === 'respins') && d.ale_mele) return b('Închide dosarul', 'inchide');
  return '';
}

async function _incarcaDosareDauna() {
  const res = await fetch('/api/partener/dosare-dauna', { headers: await _partenerAuthHeader() });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Eroare necunoscută');
  return data.dosare || [];
}

async function loadDosareDaunaReal() {
  const el = document.getElementById('dauna-lista');
  const badge = document.getElementById('dauna-badge');
  if (!el) return;
  try {
    const dosare = await _incarcaDosareDauna();
    const active = dosare.filter((d) => ['deschis', 'in_analiza'].includes(d.status)).length;
    if (badge) { badge.textContent = active + (active === 1 ? ' activ' : ' active'); badge.className = 'chip ' + (active ? 'ch-r' : 'ch-g'); }
    el.innerHTML = dosare.length ? dosare.map(_dauneCard).join('') : '<div style="color:#5A6B7D;font-size:12.5px">Niciun dosar de daună deocamdată.</div>';
  } catch (e) {
    if (badge) { badge.textContent = 'Indisponibil'; badge.className = 'chip ch-gr'; }
    el.innerHTML = `<div style="color:#C0392B;font-size:12.5px">Eroare: ${_escD(e.message)}</div>`;
  }
}

async function loadDauneOverviewReal() {
  const el = document.getElementById('ov-daune-lista');
  const badge = document.getElementById('ov-daune-badge');
  if (!el) return;
  try {
    const active = (await _incarcaDosareDauna()).filter((d) => ['deschis', 'in_analiza'].includes(d.status));
    if (badge) { badge.textContent = String(active.length); badge.className = 'chip ' + (active.length ? 'ch-r' : 'ch-g'); }
    el.innerHTML = active.length
      ? active.slice(0, 5).map((d) => `<div style="display:flex;justify-content:space-between;gap:8px;padding:7px 10px;background:#F0F4F8;border-radius:9px;font-size:12px"><span style="font-family:monospace;color:#1A5FAD">${_escD(d.claim_id)}</span><span>${_escD(_DAUNA_STATUS_LBL[d.status])}</span></div>`).join('')
      : '<div style="color:#5A6B7D;font-size:12px">Niciun dosar activ.</div>';
  } catch (e) {
    if (badge) badge.textContent = '—';
    el.innerHTML = `<div style="color:#C0392B;font-size:12px">Eroare: ${_escD(e.message)}</div>`;
  }

async function actiuneDauna(id, actiune) {
  const body = { id, actiune };
  if (actiune === 'aproba') {
    const v = window.prompt('Valoarea aprobată a daunei (număr):');
    if (v === null) return;
    body.valoare_aprobata = v.replace(',', '.');
  } else if (actiune === 'respinge') {
    const m = window.prompt('Motivul respingerii (minimum 5 caractere):');
    if (m === null) return;
    body.motiv = m;
  }
  try {
    const res = await fetch('/api/partener/dosare-dauna', { method: 'POST', headers: { ...(await _partenerAuthHeader()), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await res.json();
    if (!res.ok) throw new Error(j.error || 'Eroare necunoscută');
    showToast('Dosar actualizat');
  } catch (e) { showToast('⚠ ' + e.message); }
  loadDosareDaunaReal();
}

              <td style="padding:7px 8px;color:#5A6B7D">${f.entitate_beneficiara ? f.entitate_beneficiara.denumire : '⚠️ Entitate neconfigurată încă'}</td>
              <td style="padding:7px 8px"><button class="btn-p" style="font-size:11px;padding:5px 10px" onclick="deschideModalEmiteFactura('${f.comanda_subcontractor_id}')" ${f.entitate_beneficiara ? '' : 'disabled'}>Emite factură</button></td>
            </tr>
          `).join('')}</tbody>
        </table>`;
    } else {
      html += `<div style="padding:8px 0;margin-bottom:12px">Nicio alocare eliberată, nefacturată încă.</div>`;
    }

    if (data.facturi.length) {
      html += `<div style="font-weight:700;color:#1A2332;margin-bottom:6px">Facturi emise (${data.facturi.length})</div>
        <table style="width:100%;border-collapse:collapse;font-size:12px">

            <tr style="border-top:1px solid #EEF2F7">
              <td style="padding:7px 8px;color:#1A2332;font-weight:600">${f.numar_factura_partener}</td>
              <td style="padding:7px 8px;font-weight:700;color:#FF8C00">${fmt(f.suma, f.moneda)}</td>

            </tr>

    }

    el.innerHTML = html;
  } catch (e) {
    el.innerHTML = `<div style="color:#C0392B;padding:8px 0">Nu am putut încărca facturarea: ${e.message}</div>`;
  }
}

function deschideModalEmiteFactura(comandaSubcontractorId){
  const alocare = (_facturareCache?.facturabile || []).find(f => f.comanda_subcontractor_id === comandaSubcontractorId);
  if (!alocare) return;
  const fmt = window.formatCurrency ? (v, m) => window.formatCurrency(v, m) : (v, m) => `${v} ${m}`;
  document.getElementById('mef-detalii').innerHTML = `Comandă <b>${alocare.nr_comanda || alocare.comanda_id.slice(0,8)}</b> · Sumă <b>${fmt(alocare.suma, alocare.moneda)}</b><br>Către: <b>${alocare.entitate_beneficiara?.denumire || '—'}</b>`;
  document.getElementById('mef-numar').value = '';
  document.getElementById('mef-fisier').value = '';
  document.getElementById('mef-eroare').textContent = '';
  document.getElementById('modal-emite-factura').dataset.comandaSubcontractorId = comandaSubcontractorId;
  document.getElementById('modal-emite-factura').style.display = 'flex';
}

function inchideModalEmiteFactura(){
  document.getElementById('modal-emite-factura').style.display = 'none';
}

function _fisierLaBase64(fisier){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(fisier);
  });
}

async function submitEmiteFactura(){
  const modal = document.getElementById('modal-emite-factura');
  const comandaSubcontractorId = modal.dataset.comandaSubcontractorId;
  const numar = document.getElementById('mef-numar').value.trim();
  const fisierInput = document.getElementById('mef-fisier');
  const fisier = fisierInput.files[0];
  const eroareEl = document.getElementById('mef-eroare');
  const btn = document.getElementById('mef-submit');

  if (!numar) { eroareEl.textContent = 'Numărul facturii este obligatoriu.'; return; }
  if (!fisier) { eroareEl.textContent = 'Atașează fișierul facturii.'; return; }
  if (fisier.size > 5 * 1024 * 1024) { eroareEl.textContent = 'Fișierul depășește 5MB.'; return; }

  btn.disabled = true; btn.textContent = 'Se trimite...';
  eroareEl.textContent = '';
  try {
    const fisier_base64 = await _fisierLaBase64(fisier);
    const headers = await _partenerAuthHeader();
    headers['Content-Type'] = 'application/json';
    const res = await fetch('/api/partener/facturi', {
      method: 'POST', headers,
      body: JSON.stringify({ comanda_subcontractor_id: comandaSubcontractorId, numar_factura_partener: numar, fisier_base64, mime_type: fisier.type }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Eroare necunoscută');
    inchideModalEmiteFactura();
    loadFacturareParteneri();
  } catch (e) {
    eroareEl.textContent = e.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Trimite factura';
  }
}

async function trimiteOtpContract(){
  const btn = document.getElementById('btn-trimite-otp');

  if (btn) { btn.disabled = true; btn.textContent = 'Se trimite...'; }
  try {
    const headers = await _partenerAuthHeader();
    const res = await fetch('/api/partener/contract-trimite-otp', { method: 'POST', headers });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Eroare necunoscută');
    if (msgEl) { msgEl.style.color = '#1A7A3A'; msgEl.textContent = 'Cod trimis pe ' + (data.trimis_la || 'email') + '.'; }

async function confirmaOtpContract(){
  const cod = document.getElementById('otp-contract-input')?.value.trim();
  const msgEl = document.getElementById('otp-contract-msg');
  if (!cod) { if (msgEl) { msgEl.style.color = '#C0392B'; msgEl.textContent = 'Introdu codul primit pe email.'; } return; }

    const headers = await _partenerAuthHeader();
    const res = await fetch('/api/partener/contract-confirma-otp', {
      method: 'POST', headers: { ...headers, 'Content-Type': 'application/json' }, body: JSON.stringify({ cod }),

async function loadEchipaReal(){
  const sumar = document.getElementById('echipa-sumar');
  const el = document.getElementById('echipa-real-lista');
  if (!el) return;
  el.textContent = 'Se încarcă...';
  _incarcaEscoSelect('ang-esco');
  try {
    const headers = await _partenerAuthHeader();
    const res = await fetch('/api/partener/wizard-angajati', { headers });

    if (!res.ok) throw new Error(data.error || 'Eroare necunoscută');

    if (sumar) sumar.textContent = data.total
      ? `${data.total_disponibili} din ${data.total} membri disponibili acum`
      : 'Nu ai încă nicio echipă înregistrată';

    if (!data.angajati.length) {
      el.innerHTML = '<div style="color:#5A6B7D">Dacă lucrezi solo, nu ai nevoie de nimic aici — alocarea comenzilor rămâne neschimbată. Dacă ai o echipă, adaug-o mai jos.</div>';
      return;
    }

    el.innerHTML = data.angajati.map((a) => `
      <div style="display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid #EEF2F7">

      </div>

  } catch (e) {
    el.innerHTML = `<div style="color:#C0392B">Eroare: ${e.message}</div>`;
  }
}

async function toggleDisponibilitateAngajat(angajatId, disponibilNou, toggleEl){
  // Optimist: schimbă vizual imediat, revine dacă serverul respinge.
  if (toggleEl) { toggleEl.classList.toggle('on'); toggleEl.classList.toggle('off'); }
  try {
    const headers = await _partenerAuthHeader();
    const res = await fetch('/api/partener/wizard-angajati', {
      method: 'PATCH', headers: { ...headers, 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: angajatId, disponibil: disponibilNou }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Eroare necunoscută');
    loadEchipaReal(); // resincronizează sumarul "X din Y disponibili"
  } catch (e) {
    alert('Eroare: ' + e.message);
    if (toggleEl) { toggleEl.classList.toggle('on'); toggleEl.classList.toggle('off'); } // revert
  }
}

async function adaugaAngajat(){
  const msgEl = document.getElementById('ang-msg');
  const nume = document.getElementById('ang-nume')?.value.trim();
  const cnp = document.getElementById('ang-cnp')?.value.trim();
  const cod_esco = document.getElementById('ang-esco')?.value || null;
  if (!nume || !/^\d{13}$/.test(cnp || '')) {
    if (msgEl) { msgEl.textContent = 'Nume și CNP valid (13 cifre) sunt obligatorii.'; msgEl.style.color = '#C0392B'; }
    return;
  }
  try {
    const headers = await _partenerAuthHeader();
    const res = await fetch('/api/partener/wizard-angajati', {
      method: 'POST', headers: { ...headers, 'Content-Type': 'application/json' },
      body: JSON.stringify({ angajati: [{ nume, cnp, cod_esco }] }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Eroare necunoscută');
    document.getElementById('ang-nume').value = '';
    document.getElementById('ang-cnp').value = '';
    if (msgEl) { msgEl.textContent = 'Adăugat.'; msgEl.style.color = '#1A7A3A'; }
    loadEchipaReal();
  } catch (e) {
    if (msgEl) { msgEl.textContent = 'Eroare: ' + e.message; msgEl.style.color = '#C0392B'; }
  }
}

async function stergeAngajat(id){
  if (!confirm('Ștergi acest membru din echipă?')) return;
  try {
    const headers = await _partenerAuthHeader();
    const res = await fetch('/api/partener/wizard-angajati', {
      method: 'DELETE', headers: { ...headers, 'Content-Type': 'application/json' },
      body: JSON.stringify({ id }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Eroare necunoscută');
    loadEchipaReal();
  } catch (e) { alert('Eroare: ' + e.message); }
}

async function loadCertificariReal(){

    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Eroare necunoscută');

    if (selTip) {
      selTip.innerHTML = data.cerinte.length
        ? data.cerinte.map(c => `<option value="${c.nume_certificare}">${c.nume_certificare}${c.obligatorie ? ' (obligatorie)' : ''}</option>`).join('')

async function adaugaCertificare(){
  const msgEl = document.getElementById('cert-msg');
  const tip = document.getElementById('cert-tip')?.value;
  const fisier = document.getElementById('cert-fisier')?.files?.[0];
  if (!tip || !fisier) { if (msgEl) { msgEl.textContent = 'Alege tipul de certificare și un fișier.'; msgEl.style.color = '#C0392B'; } return; }
  try {
    const { data: { user } } = await window.supabaseClient.auth.getUser();
    const ext = (fisier.name.split('.').pop() || 'pdf').toLowerCase();
    const path = `${user.id}/certificari/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
    const { error: upErr } = await window.supabaseClient.storage.from('partner-certificari').upload(path, fisier, { contentType: fisier.type });
    if (upErr) throw upErr;

    const headers = await _partenerAuthHeader();
    const res = await fetch('/api/partener/wizard-certificari', {
      method: 'POST', headers: { ...headers, 'Content-Type': 'application/json' },
      body: JSON.stringify({ tip_certificare: tip, document_path: path }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Eroare necunoscută');
    document.getElementById('cert-fisier').value = '';
    if (msgEl) { msgEl.textContent = 'Adăugată.'; msgEl.style.color = '#1A7A3A'; }
    loadCertificariReal();
  } catch (e) {
    if (msgEl) { msgEl.textContent = 'Eroare: ' + (e.message || e); msgEl.style.color = '#C0392B'; }
  }
}

async function loadTipuriPolitaReal(){
  const el = document.getElementById('tp-real-lista');
  if (!el) return;
  el.textContent = 'Se încarcă...';
  try {
    const headers = await _partenerAuthHeader();
    const res = await fetch('/api/partener/tipuri-polita', { headers });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Eroare necunoscută');
    if (!data.tipuri.length) { el.innerHTML = '<div style="color:#5A6B7D">Niciun tip de poliță adăugat încă.</div>'; return; }
    el.innerHTML = data.tipuri.map((t) => `
      <div style="display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid #EEF2F7">
        <span style="flex:1"><strong style="color:#1A2332;font-size:13px">${t.tip_polita}</strong><br><span style="font-size:11px;color:#5A6B7D">${t.limita_acoperire_eur ? 'Limită: €' + t.limita_acoperire_eur : 'Fără limită declarată'}${t.comision_pct != null ? ' · Comision: ' + t.comision_pct + '%' : ''}</span></span>
        <button class="btn-ghost" style="padding:5px 10px;font-size:11px;color:#C0392B" onclick="stergeTipPolita('${t.id}')">Șterge</button>
      </div>
    `).join('');
  } catch (e) {
    el.innerHTML = `<div style="color:#C0392B">Eroare: ${e.message}</div>`;
  }
}

async function adaugaTipPolita(){
  const msgEl = document.getElementById('tp-msg');
  const tip_polita = document.getElementById('tp-tip')?.value.trim();
  const limitaVal = document.getElementById('tp-limita')?.value;
  const comisionVal = document.getElementById('tp-comision')?.value;
  if (!tip_polita) {
    if (msgEl) { msgEl.textContent = 'Tipul de poliță este obligatoriu.'; msgEl.style.color = '#C0392B'; }
    return;
  }
  try {
    const headers = await _partenerAuthHeader();
    const res = await fetch('/api/partener/tipuri-polita', {
      method: 'POST', headers: { ...headers, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        tip_polita,
        limita_acoperire_eur: limitaVal ? Number(limitaVal) : null,
        comision_pct: comisionVal ? Number(comisionVal) : null,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Eroare necunoscută');
    ['tp-tip','tp-limita','tp-comision'].forEach(id => { const e = document.getElementById(id); if (e) e.value = ''; });
    if (msgEl) { msgEl.textContent = 'Adăugat.'; msgEl.style.color = '#1A7A3A'; }
    loadTipuriPolitaReal();
  } catch (e) {
    if (msgEl) { msgEl.textContent = 'Eroare: ' + e.message; msgEl.style.color = '#C0392B'; }
  }
}

async function stergeTipPolita(id){
  if (!confirm('Ștergi acest tip de poliță?')) return;
  try {
    const headers = await _partenerAuthHeader();
    const res = await fetch('/api/partener/tipuri-polita', {
      method: 'DELETE', headers: { ...headers, 'Content-Type': 'application/json' },
      body: JSON.stringify({ id }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Eroare necunoscută');
    loadTipuriPolitaReal();
  } catch (e) { alert('Eroare: ' + e.message); }
}

function _sumaFmt(n, moneda) {
  return (Number(n) || 0).toLocaleString('ro-RO', { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + ' ' + (moneda || 'RON');
}
function _dataFmt(iso) {
  if (!iso) return '—';
  try { return new Date(iso).toLocaleDateString('ro-RO', { day: 'numeric', month: 'short', year: 'numeric' }); } catch (e) { return '—'; }
}
function _stareCont(html) {
  if (PARTENER_CONT) return null;

function kpiReale(type) {
  const col = TYPES[type].color;

  if (!c) return [1, 2, 3, 4].map(() => kpi('…', '…', 'se încarcă', col, '⏳')).join('');

  const primul = type === 'asigurari'
    ? kpi('Polițe cu comision', String(c.polite.length), 'comenzi cu asigurare', col, '📄')
    : kpi('Comenzi active', String(k.comenzi_active), 'acceptate, în execuție sau finalizate', col, '📦');
  return primul
    + kpi(type === 'asigurari' ? 'Comisioane luna' : 'Câștig luna', _sumaFmt(k.castig_luna, k.moneda), 'eliberat din escrow luna aceasta', col, '💰')

};

async function incarcaDocumentPartener() {
  const msg = document.getElementById('doc-msg');
  const btn = document.getElementById('doc-btn');
  const set = (t, ok) => { if (msg) { msg.textContent = t; msg.style.color = ok ? '#1A7A3A' : '#C0392B'; } };
  const fisier = document.getElementById('doc-fisier').files[0];
  const tip = document.getElementById('doc-tip').value;
  const EXT = { 'application/pdf': 'pdf', 'image/jpeg': 'jpg', 'image/png': 'png' };
  if (!fisier) return set('Alege un fișier.', false);
  if (!EXT[fisier.type]) return set('Acceptăm doar PDF, JPG sau PNG.', false);
  if (fisier.size > 10 * 1024 * 1024) return set('Fișierul depășește 10 MB.', false);
  if (btn) btn.disabled = true;
  set('Se încarcă...', true);
  try {
    const { data: { session } } = await window.supabaseClient.auth.getSession();
    const uid = session && session.user && session.user.id;
    if (!uid) throw new Error('Sesiunea a expirat. Autentifică-te din nou.');
    const cale = `${uid}/doc-${tip}-${Date.now()}.${EXT[fisier.type]}`;
    const { error: upErr } = await window.supabaseClient.storage.from('partner-certificari').upload(cale, fisier, { contentType: fisier.type, upsert: false });
    if (upErr) throw new Error('Încărcarea în Storage a eșuat: ' + upErr.message);
    const res = await fetch('/api/partener/documente', {
      method: 'POST', headers: { ...(await _partenerAuthHeader()), 'Content-Type': 'application/json' },
      body: JSON.stringify({ tip_document: tip, document_path: cale }),
    });
    const j = await res.json();
    if (!res.ok) throw new Error(j.error || 'Eroare necunoscută');
    showToast('Document încărcat. Îl verifică echipa My Darrin.');
    await loadPartenerCont();
  } catch (e) {
    set(e.message, false);
    if (btn) btn.disabled = false;
  }
}

async function stergeDocumentPartener(id) {
  if (!window.confirm('Ștergi acest document?')) return;
  try {
    const res = await fetch('/api/partener/documente', {

    });
    const j = await res.json();
    if (!res.ok) throw new Error(j.error || 'Eroare necunoscută');
    await loadPartenerCont();
  } catch (e) { showToast('⚠ ' + e.message); }
}

<script id="partner-router">
/* ═══════════════════════════════════════════════════════════════════
   MY DARRIN — PARTNER NAVIGATION ROUTER v2026.06
   Unified router for all "Devino Partener" entry points across pages.

   Handles:
   1. Same-page modal trigger (pages WITH partner-modal)
   2. Cross-page deep link (?type=xxx) with auto-open on landing
   3. devino-partener.html internal type switching without reload
   4. Sidebar/hamburger menu entries
   5. CTA buttons in hero sections
   ═══════════════════════════════════════════════════════════════════ */

(function () {
  'use strict';

  // ── CONSTANTS ──────────────────────────────────────────────────
  const PARTNER_PAGE = 'mydarrin-devino-partener.html';
  const VALID_TYPES  = ['servicii', 'materiale', 'inchirieri',
                        'curier',   'asigurari'];
  const IS_PARTNER_PAGE = window.location.pathname
    .split('/').pop().replace(/\?.*$/, '') === PARTNER_PAGE;

  // ─────────────────────────────────────────────────────────────
  // 1. CORE ROUTER — handlePartnerNavigation(type)
  //    Called from every entry point (navbar, sidebar, CTA, footer)
  // ─────────────────────────────────────────────────────────────
  window.handlePartnerNavigation = function (type) {
    const t = (VALID_TYPES.includes(type) ? type : 'servicii');

    // A. Already on devino-partener.html → switch type in-place
    if (IS_PARTNER_PAGE) {
      _switchTypeOnWizardPage(t);
      return;
    }

    // B. Has an embedded partner-modal on THIS page → open it
    const modal = document.getElementById('partner-modal');
    if (modal) {
      if (typeof openPartnerModal === 'function') {
        openPartnerModal(t);
      } else {
        modal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
        if (typeof selectPartnerType === 'function') {
          setTimeout(() => selectPartnerType(t), 80);
        }
      }
      return;
    }

    // C. No modal on this page → navigate with deep-link param
    _navigateToPartnerPage(t);
  };

  // ─────────────────────────────────────────────────────────────
  // 2. ALIAS — openPartnerWizard(type)
  //    Architectural requirement alias
  // ─────────────────────────────────────────────────────────────
  window.openPartnerWizard = window.handlePartnerNavigation;

  // ─────────────────────────────────────────────────────────────
  // 3. INTERNAL: switch type on devino-partener.html without reload
  // ─────────────────────────────────────────────────────────────
  function _switchTypeOnWizardPage(type) {
    // Try full wizard openPartnerModal first
    if (typeof openPartnerModal === 'function') {
      openPartnerModal(type);
      return;
    }
    // Fallback: directly manipulate WIZARD_DATA selectedPartnerType
    if (typeof selectType === 'function') {
      selectType(type, null);
      return;
    }
    // Last resort: set global and re-render
    if (typeof selectedPartnerType !== 'undefined') {
      // eslint-disable-next-line no-global-assign
      selectedPartnerType = type;
    }
    if (typeof renderStep === 'function') renderStep(0);
    // Update URL without reload (history API)
    const url = new URL(window.location.href);
    url.searchParams.set('type', type);
    window.history.replaceState({}, '', url.toString());
    _scrollToWizard();
  }

  // ─────────────────────────────────────────────────────────────
  // 4. INTERNAL: cross-page navigation with ?type= deep link
  // ─────────────────────────────────────────────────────────────
  function _navigateToPartnerPage(type) {
    const base = _resolveBase();
    window.location.href = base + PARTNER_PAGE + '?type=' + type;
  }

  function _resolveBase() {
    const href  = window.location.href;
    const parts = href.split('?')[0].split('/');
    parts.pop(); // remove current filename
    return parts.join('/') + '/';
  }

  function _scrollToWizard() {
    const el = document.getElementById('partner-wizard') ||
               document.getElementById('partner-modal')  ||
               document.querySelector('[data-wizard="partner"]');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ─────────────────────────────────────────────────────────────
  // 5. AUTO-OPEN on devino-partener.html: read ?type= from URL
  // ─────────────────────────────────────────────────────────────
  function _autoOpenFromURLParam() {
    if (!IS_PARTNER_PAGE) return;
    const params = new URLSearchParams(window.location.search);
    const type   = params.get('type');
    if (!type || !VALID_TYPES.includes(type)) return;

    // Wait for wizard init then open
    const _tryOpen = (attempts) => {
      if (attempts <= 0) return;
      if (typeof openPartnerModal === 'function') {
        openPartnerModal(type);
        // Clean URL
        const url = new URL(window.location.href);
        url.searchParams.delete('type');
        window.history.replaceState({}, '', url.toString());
      } else {
        setTimeout(() => _tryOpen(attempts - 1), 150);
      }
    };
    setTimeout(() => _tryOpen(10), 200);
  }

  // ─────────────────────────────────────────────────────────────
  // 6. INTERCEPT all <a> tags pointing to devino-partener.html
  //    that have onclick="openPartnerModal(...)" —
  //    prevent default href navigation, use router instead
  // ─────────────────────────────────────────────────────────────
  function _interceptPartnerLinks() {
    document.querySelectorAll('a[href*="devino-partener"]').forEach(el => {
      // Already has router handler attached?
      if (el.dataset.routerAttached) return;
      el.dataset.routerAttached = 'true';

      // Extract type from existing onclick attr or data attr
      let type = el.dataset.partnerType || null;
      const onclickStr = el.getAttribute('onclick') || '';
      const typeMatch  = onclickStr.match(/openPartnerModal\(['"](\w+)['"]\)/) ||
                         onclickStr.match(/handlePartnerNavigation\(['"](\w+)['"]\)/) ||
                         onclickStr.match(/openPartnerWizard\(['"](\w+)['"]\)/);
      if (typeMatch) type = typeMatch[1];

      // Check href for ?type=
      const href = el.getAttribute('href') || '';
      const hrefType = href.match(/[?&]type=(\w+)/);
      if (!type && hrefType) type = hrefType[1];

      el.addEventListener('click', function (e) {
        // Only intercept same-domain devino-partener links
        if (href.includes('devino-partener')) {
          e.preventDefault();
          // Close sidebar/mobile menu if open
          if (typeof closeSidebar  === 'function') closeSidebar();
          if (typeof closeNavMenu  === 'function') closeNavMenu();
          handlePartnerNavigation(type || 'servicii');
        }
      });
    });
  }

  // ─────────────────────────────────────────────────────────────
  // 7. SIDEBAR HELPER — sb-item with data-partner-type
  //    <div class="sb-item" data-partner-type="servicii" …>
  // ─────────────────────────────────────────────────────────────
  function _bindSidebarItems() {
    document.querySelectorAll('[data-partner-type]').forEach(el => {
      if (el.dataset.routerAttached) return;
      el.dataset.routerAttached = 'true';
      el.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        if (typeof closeSidebar === 'function') closeSidebar();
        handlePartnerNavigation(this.dataset.partnerType);
      });
    });
  }

  // ─────────────────────────────────────────────────────────────
  // 8. MutationObserver — catch dynamically injected partner links
  // ─────────────────────────────────────────────────────────────
  function _observeDynamicLinks() {
    const observer = new MutationObserver(() => {
      _interceptPartnerLinks();
      _bindSidebarItems();
    });
    observer.observe(document.body, { childList: true, subtree: true });
  }

  // ─────────────────────────────────────────────────────────────
  // 9. INIT
  // ─────────────────────────────────────────────────────────────
  function _init() {
    _interceptPartnerLinks();
    _bindSidebarItems();
    _autoOpenFromURLParam();
    _observeDynamicLinks();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _init);
  } else {
    _init();
  }

})();
</script>

const VEHICLE_RULES = {

  auto:        { max_kg: 50,  max_vol_L: 200, label:'Autoturism' },
  utilitara:   { max_kg: 500, max_vol_L: 2000,label:'Autoutilitară' },
  camion:      { max_kg:5000, max_vol_L:20000,label:'Camion' },
};

// Vehiculul activ al curierului (setat la login/profil)
let CURIER_VEHICUL_ACTIV = 'utilitara'; // default setat din profil

function setCurierVehicul(tip) {
  CURIER_VEHICUL_ACTIV = tip;
  showToast('🚗 Vehicul activ: ' + (VEHICLE_RULES[tip]?.label || tip));
}

function canAcceptCursa(cursa) {
  const regula = VEHICLE_RULES[CURIER_VEHICUL_ACTIV];
  if (!regula) return { ok: true };
  const kg  = cursa.greutate_kg  || 0;
  const vol = cursa.volum_L      || 0;
  if (kg > regula.max_kg) {
    return { ok: false, motiv: `Greutate ${kg}kg depășește limita vehiculului tău (${regula.max_kg}kg). Ai nevoie de Autoutilitară.` };
  }
  if (vol > regula.max_vol_L) {
    return { ok: false, motiv: `Volum ${vol}L depășește limita vehiculului tău (${regula.max_vol_L}L). Ai nevoie de Autoutilitară.` };
  }
  return { ok: true };
}

function preiaComanda(cursaId, kg, volL) {
  const cursaData = { id: cursaId, greutate_kg: kg, volum_L: volL };

  // BC1 — Verificare vehicul
  const check = canAcceptCursa(cursaData);
  if (!check.ok) {
    showAlertVehicul(check.motiv, cursaId, kg, volL);
    return;
  }

  // BC2 — Ocupat în cursă: cursa nouă intră automat în coada FIFO
  if (CURIER_STARE.is_active_in_ride) {
    adaugaInCoada(cursaData);
    showPanel('curse');
    return;
  }

  // Acceptăm cursa
  CURIER_STARE.is_active_in_ride = true;
  CURIER_STARE.cursa_activa_id   = cursaId;
  showToast('✅ Cursă #' + cursaId + ' preluată!');
  showPanel('activ');
}

function showAlertVehicul(motiv, cursaId, kg, volL) {
  const overlay = document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:900;display:flex;align-items:center;justify-content:center;padding:20px';
  overlay.innerHTML=`
    <div style="background:#fff;border-radius:18px;max-width:360px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)">
      <div style="font-size:40px;text-align:center;margin-bottom:12px">🚫</div>
      <h3 style="font-size:16px;font-weight:800;color:#C0392B;text-align:center;margin-bottom:10px">Vehicul incompatibil</h3>
      <p style="font-size:12.5px;color:#5A6B7D;text-align:center;line-height:1.6;margin-bottom:16px">${motiv}</p>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button onclick="setCurierVehicul('utilitara');this.closest('[style*=fixed]').remove();preiaComanda('${cursaId}',${kg||0},${volL||0})"
                style="padding:11px;border-radius:11px;border:none;background:#7C3AED;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">
          🚐 Schimbă pe Utilitară și preia cursa
        </button>
        <button onclick="this.closest('[style*=fixed]').remove()"
                style="padding:10px;border-radius:11px;border:1.5px solid #D5DFE8;background:#fff;color:#5A6B7D;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">
          Refuză cursa
        </button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

// ════════════════════════════════════════════════════════════════
// BC2 — STATUS „OCUPAT ÎN CURSĂ" — management stare concurentă
// ════════════════════════════════════════════════════════════════

const CURIER_STARE = {
  is_active_in_ride: false,
  cursa_activa_id:   null,
  coada_curse:       [], // cursele care așteaptă
};

function finalizareCursa(cursaId) {
  if (CURIER_STARE.cursa_activa_id !== cursaId) return;
  CURIER_STARE.is_active_in_ride = false;
  CURIER_STARE.cursa_activa_id   = null;
  showToast('✅ Cursă #' + cursaId + ' finalizată · Escrow eliberat');

  // FIFO: prima cursă primită cât timp erai ocupat se oferă prima
  if (CURIER_STARE.coada_curse.length > 0) {
    const urmatoarea = CURIER_STARE.coada_curse.shift();
    showPanel('curse');
    setTimeout(() => showCursaDinCoada(urmatoarea), 400);
  } else {
    showPanel('curse');
  }
}

function adaugaInCoada(cursa) {
  if (CURIER_STARE.cursa_activa_id === cursa.id || CURIER_STARE.coada_curse.some(c => c.id === cursa.id)) {
    showToast('ℹ Cursa #' + cursa.id + ' este deja în coadă sau activă');
    return;
  }
  CURIER_STARE.coada_curse.push(cursa);
  showToast(`⏳ Cursă #${cursa.id} adăugată în coadă (poziția ${CURIER_STARE.coada_curse.length})`);
}

function refuzaCursa(cursaId) {
  CURIER_STARE.coada_curse = CURIER_STARE.coada_curse.filter(c => c.id !== cursaId);
  CURSE_REFUZATE.add(cursaId);
  showToast('Cursă #' + cursaId + ' refuzată');
  if (currentPanel === 'curse') showPanel('curse');
}

function showCursaDinCoada(cursa) {
  const c = CURSE_DEMO[cursa.id] || {};
  const overlay = document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:900;display:flex;align-items:center;justify-content:center;padding:20px';
  overlay.innerHTML=`
    <div style="background:#fff;border-radius:18px;max-width:360px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)">
      <div style="font-size:32px;text-align:center;margin-bottom:10px">📨</div>
      <h3 style="font-size:16px;font-weight:800;color:#1A2332;text-align:center;margin-bottom:6px">Următoarea cursă din coadă</h3>
      <p style="font-size:12.5px;color:#5A6B7D;text-align:center;line-height:1.6;margin-bottom:16px"><strong>#${cursa.id}</strong>${c.title ? ' · ' + c.title : ''}${c.price ? '<br>' + c.km + ' · ' + c.price : ''}</p>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button onclick="this.closest('[style*=fixed]').remove();preiaComanda('${cursa.id}',${cursa.greutate_kg||0},${cursa.volum_L||0})"
                style="padding:11px;border-radius:11px;border:none;background:#7C3AED;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">Preia cursa</button>
        <button onclick="this.closest('[style*=fixed]').remove();refuzaCursa('${cursa.id}')"
                style="padding:10px;border-radius:11px;border:1.5px solid #D5DFE8;background:#fff;color:#5A6B7D;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">Refuz</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

        </div>
        <button onclick="this.closest('[style*=fixed]').remove()" style="margin-left:auto;width:28px;height:28px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);cursor:pointer;color:#fff;font-size:16px">×</button>
      </div>
      <div style="padding:18px 20px">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px;margin-bottom:14px">
          <div style="background:#F0F4F8;border-radius:9px;padding:9px 12px"><div style="color:#5A6B7D;font-size:9.5px;margin-bottom:2px">📤 EXPEDITOR</div><div style="font-weight:700">${furnizor}</div></div>
          <div style="background:#F0F4F8;border-radius:9px;padding:9px 12px"><div style="color:#5A6B7D;font-size:9.5px;margin-bottom:2px">📍 DESTINATAR</div><div style="font-weight:700">${destinatar}</div></div>
          <div style="background:#F0F4F8;border-radius:9px;padding:9px 12px"><div style="color:#5A6B7D;font-size:9.5px;margin-bottom:2px">📦 PRODUS</div><div style="font-weight:700">${produs}</div></div>
          <div style="background:#F0F4F8;border-radius:9px;padding:9px 12px"><div style="color:#5A6B7D;font-size:9.5px;margin-bottom:2px">⚖ GREUTATE</div><div style="font-weight:700">${greutate_kg > 0 ? greutate_kg + ' kg' : 'n/d'}</div></div>
          <div style="background:#F0F4F8;border-radius:9px;padding:9px 12px"><div style="color:#5A6B7D;font-size:9.5px;margin-bottom:2px">📐 DIMENSIUNI</div><div style="font-weight:700">${dimensiuni}</div></div>
          <div style="background:#F0F4F8;border-radius:9px;padding:9px 12px"><div style="color:#5A6B7D;font-size:9.5px;margin-bottom:2px">✅ STARE COLET</div><div style="font-weight:700;color:${stareColet==='intact'?'#1A7A3A':'#C0392B'}">${stareColet==='intact'?'Intact':'⚠ Deteriorat'}</div></div>
        </div>
        <div style="background:#EBF4FB;border-radius:10px;padding:10px 12px;margin-bottom:14px;border:1px solid #D5DFE8">
          <div style="display:flex;align-items:center;justify-content:space-between;font-size:11.5px">
            <div><div style="color:#5A6B7D;margin-bottom:2px">Timestamp confirmare</div><div style="font-weight:700">${ts}</div></div>
            <div style="text-align:right"><div style="color:#5A6B7D;margin-bottom:2px">Hash verificare</div><div style="font-family:monospace;font-weight:700;color:#1A5FAD">${cmrData.hash}</div></div>
          </div>
        </div>
        <div style="background:#D4EDDA;border-radius:10px;padding:9px 12px;margin-bottom:14px;border:1px solid rgba(26,122,58,.2);font-size:11.5px;color:#1A7A3A;font-weight:600">

        </div>
        <div style="display:flex;gap:8px">
          <button onclick="printCMR('${cmrId}');this.closest('[style*=fixed]').remove()" style="flex:1;padding:10px;border-radius:10px;border:none;background:#003366;color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit">🖨️ Print / PDF</button>

// IO1 — BUTON PAUZA RAPIDĂ
// ════════════════════════════════════════════════════════════════

let CURIER_IN_PAUZA = false;
let PAUZA_DURATA_MIN = 30;

function togglePauzaRapida() {
  CURIER_IN_PAUZA = !CURIER_IN_PAUZA;
  const btn = document.getElementById('btn-pauza');
  if (btn) {
    if (CURIER_IN_PAUZA) {
      btn.style.background = '#C0392B';
      btn.textContent = '▶ Reluare activitate';
      btn.title = 'Ești în pauză. Dispatch-ul este blocat temporar.';
    } else {
      btn.style.background = '#FF8C00';
      btn.textContent = '⏸ Pauză ' + PAUZA_DURATA_MIN + ' min';
      btn.title = 'Blochează temporar primirea de noi curse.';
    }
  }
  showToast(CURIER_IN_PAUZA
    ? '⏸ Pauză activă · Nicio cursă nouă nu va fi primită'
    : '▶ Activitate reluată · Ești din nou disponibil pentru curse'
  );
}

function showPauzaModal() {
  const opts = [15, 30, 45, 60, 90];
  const overlay = document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:900;display:flex;align-items:center;justify-content:center;padding:20px';
  overlay.innerHTML=`
    <div style="background:#fff;border-radius:18px;max-width:340px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)">
      <div style="font-size:32px;text-align:center;margin-bottom:10px">⏸</div>
      <h3 style="font-size:16px;font-weight:800;color:#1A2332;text-align:center;margin-bottom:6px">Pauză temporară</h3>
      <p style="font-size:12.5px;color:#5A6B7D;text-align:center;margin-bottom:16px">Selectează durata. Dispatch-ul este blocat în acest interval.</p>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px">
        ${opts.map(m=>`<button onclick="selectPauza(${m},this)" style="padding:10px;border-radius:10px;border:1.5px solid #D5DFE8;background:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s" onmouseover="this.style.borderColor='#FF8C00'" onmouseout="this.style.borderColor='#D5DFE8'">${m} min</button>`).join('')}
      </div>
      <button id="confirm-pauza" disabled onclick="confirmPauza();this.closest('[style*=fixed]').remove()" 
              style="width:100%;padding:12px;border-radius:12px;border:none;background:#CBD5E0;color:#fff;font-size:14px;font-weight:700;cursor:not-allowed;font-family:inherit">
        Activează pauza
      </button>
      <button onclick="this.closest('[style*=fixed]').remove()" style="width:100%;margin-top:8px;padding:10px;border-radius:12px;border:1.5px solid #D5DFE8;background:#fff;color:#5A6B7D;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">
        Anulează
      </button>
    </div>`;
  document.body.appendChild(overlay);
}

function selectPauza(min, btn) {
  PAUZA_DURATA_MIN = min;
  document.querySelectorAll('[onclick*="selectPauza"]').forEach(b=>{b.style.background='#fff';b.style.borderColor='#D5DFE8';b.style.color='#1A2332';});
  btn.style.background='#FF8C00'; btn.style.borderColor='#FF8C00'; btn.style.color='#fff';
  const confirmBtn = document.getElementById('confirm-pauza');
  if (confirmBtn) { confirmBtn.disabled=false; confirmBtn.style.background='#FF8C00'; confirmBtn.style.cursor='pointer'; }
}

function confirmPauza() {
  CURIER_IN_PAUZA = true;
  showToast('⏸ Pauză de ' + PAUZA_DURATA_MIN + ' min activată · Reluare automată la ' +
    new Date(Date.now()+PAUZA_DURATA_MIN*60000).toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'}));
  setTimeout(()=>{CURIER_IN_PAUZA=false; showToast('▶ Pauza a expirat · Ești disponibil pentru curse');}, PAUZA_DURATA_MIN*60000);
}

}
