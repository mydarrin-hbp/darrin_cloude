<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8"/>
<!-- Pasul 11-C4 (4 nov. 2026, decizia LM: un singur catalog): pagina de categorie
     dubla catalogul. Adresa duce permanent la mydarrin-catalog, cu filtrul
     categoriei (redirect 301 în vercel.json; aici, pentru orice altă cale de
     acces). Parametrii existenți (de exemplu ?cat=<subcategorie>) se păstrează. -->
<script src="/i18n-loader.js" data-pagina="mydarrin-categorie-materiale"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<link rel="canonical" href="https://mydarrin.homebestpal.com/mydarrin-catalog?categorie=materiale"/>
<title>Catalogul My Darrin</title>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  p.set('categorie', 'materiale');
  location.replace('/mydarrin-catalog?' + p.toString() + location.hash);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=/mydarrin-catalog?categorie=materiale"/></noscript>
<style>body{margin:0;font-family:'Helvetica Neue',Arial,system-ui,sans-serif;background:#F7F9FC;color:#2D2D2D;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px;text-align:center}a{color:#003366;font-weight:700}</style>
</head>
<body>
<p>Pagina s-a mutat în catalog. <a href="/mydarrin-catalog?categorie=materiale">Mergi la catalog</a></p>
</body>
</html>
