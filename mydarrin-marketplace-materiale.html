<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8"/>
<!-- Limba (10 oct. 2026): engleza implicită, româna din selector — i18n-loader.js, sincron, primul script -->
<script src="/i18n-loader.js" data-pagina="mydarrin-marketplace-materiale"></script>
<link rel="alternate" hreflang="en" href="https://mydarrin.homebestpal.com/mydarrin-marketplace-materiale?lang=en"/>
<link rel="alternate" hreflang="ro" href="https://mydarrin.homebestpal.com/mydarrin-marketplace-materiale?lang=ro"/>
<link rel="alternate" hreflang="x-default" href="https://mydarrin.homebestpal.com/mydarrin-marketplace-materiale"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Materiale și închirieri | My Darrin</title>
<meta name="description" content="Materiale și echipamente de închiriat, cu prețul final cu TVA, de la furnizori verificați My Darrin."/>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:'Helvetica Neue',Arial,system-ui,sans-serif;background:#F7F9FC;color:#2D2D2D;overflow-x:hidden}
  header{background:#003366;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
  header a.logo{color:#fff;font-weight:800;font-size:16px;text-decoration:none;letter-spacing:.02em}
  header a.back{color:rgba(255,255,255,.8);font-size:13px;text-decoration:none}
  header a.back:hover{color:#fff}
  .wrap{max-width:1040px;margin:0 auto;padding:24px 16px 90px}
  h1{font-size:21px;font-weight:800;color:#003366;margin:0 0 4px}
  .sub{font-size:13px;color:#6B7A8D;margin:0 0 20px;line-height:1.5}
  .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .tab-btn{padding:9px 16px;border-radius:10px;border:1.5px solid #D5DFE8;background:#fff;color:#6B7A8D;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .tab-btn.active{border-color:#0E9E99;background:#0E9E99;color:#fff}
  .noduri{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .nod{padding:6px 12px;border-radius:999px;border:1px solid #D5DFE8;background:#fff;color:#3A4A5C;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nod.active{background:#003366;border-color:#003366;color:#fff}
  .search{width:100%;padding:11px 16px;border:1.5px solid #D5DFE8;border-radius:12px;font-size:13.5px;font-family:inherit;margin-bottom:18px;background:#fff}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .card{background:#fff;border:1px solid #E8ECF0;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;overflow:hidden;min-width:0}
  .card-img{width:calc(100% + 32px);margin:-16px -16px 0;height:150px;object-fit:cover;background:#F4F7F9;display:block}
  .card-thumbs{display:flex;gap:4px;flex-wrap:wrap}
  .card-thumbs img{width:32px;height:32px;object-fit:cover;border-radius:6px;border:1px solid #E8ECF0;cursor:pointer}
  .card-title{font-size:14px;font-weight:700;color:#003366;line-height:1.3;overflow-wrap:anywhere}
  .card-desc{font-size:12px;color:#6B7A8D;line-height:1.5;flex:1;overflow-wrap:anywhere}
  .card-meta{font-size:11.5px;color:#5A6B7D;line-height:1.5}
  .card-price{font-size:16px;font-weight:800;color:#0E9E99}
  .card-price span{font-size:11px;font-weight:600;color:#8C9BAD}
  .card-actiuni{display:flex;gap:8px;align-items:center}
  .qty{width:64px;padding:8px;border:1.5px solid #D5DFE8;border-radius:10px;font-family:inherit;font-size:13px}
  .btn-select{flex:1;padding:9px;border-radius:10px;border:none;background:#FF8C00;color:#1A1A1A;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit}
  .btn-select:disabled{background:#F4F7F9;color:#8C9BAD;cursor:default}
  .empty-state{text-align:center;padding:48px 24px;color:#6B7A8D;font-size:14px;background:#fff;border:1px dashed #D5DFE8;border-radius:14px}
  .paginare{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:20px;font-size:12.5px;color:#5A6B7D}
  .paginare button{padding:8px 14px;border-radius:10px;border:1.5px solid #D5DFE8;background:#fff;font-family:inherit;font-weight:700;cursor:pointer;color:#003366}
  .paginare button:disabled{color:#B8C4CE;cursor:default}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:#1A7A3A;color:#fff;padding:12px 22px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 8px 28px rgba(0,0,0,.18);transition:transform .3s ease;z-index:99;max-width:calc(100% - 32px)}
  .toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <a class="logo" href="index.html">My Darrin</a>
  <a class="back" href="mydarrin-catalog.html" id="link-inapoi">← Înapoi la catalog</a>
</header>

<main class="wrap">
  <h1 id="titlu-pagina">Materiale și închirieri</h1>
  <p class="sub" id="context-sub">Produse reale, cu prețul final cu TVA inclus.</p>

  <div class="tabs" role="tablist">
    <button class="tab-btn active" id="tab-materiale" role="tab" onclick="schimbaTab('materiale')">Materiale</button>
    <button class="tab-btn" id="tab-echipamente" role="tab" onclick="schimbaTab('echipamente')">Echipamente de închiriat</button>
  </div>
  <div class="noduri" id="noduri"></div>
  <input type="search" class="search" id="cauta" placeholder="Caută în listă..." aria-label="Caută în listă..."/>

  <div id="mesaj"></div>
  <div class="grid" id="grid"></div>
  <div class="paginare" id="paginare"></div>
</main>

<div class="toast" id="toast" role="status"></div>

<script src="/ui-feedback.js"></script>
<script>
// Marketplace-ul public (pasul 10a, 16 oct. 2026): produsele reale din
// marketplace_materiale / marketplace_echipamente, doar cele aprobate (live) și
// active, prin /api/public/marketplace-produse — fără citire REST directă cu
// cheia anon. Afișare pe nodurile de meniu ale capitolelor G și O77; un nod
// fără produse live nu apare. Fără produse live: „Produsele apar în curând.”,
// nu exemple.
// Două moduri:
//  - din configuratorul unui serviciu (?slug=&type=): produsul ales revine în
//    mydarrin-produs.html (?addAddon=mp:<tip>:<uuid>) și intră în prețul serviciului;
//  - direct (fără slug): cantitate + „Comandă” → prețul real (POST) → checkout.
const t = (ro, p) => (typeof window.t === 'function' ? window.t(null, ro, p) : ro);
const LIMBA = window.MYD_I18N && window.MYD_I18N.lang === 'ro' ? 'ro' : 'en';
const TARA = 'RO';
const params = new URLSearchParams(window.location.search);
const PARENT_SLUG = params.get('slug') || '';
const PARENT_TYPE = params.get('type') || 'servicii';
const DIN_CONFIGURATOR = !!PARENT_SLUG;

const stare = {
  tip: params.get('tip') === 'echipamente' ? 'echipamente' : 'materiale',
  nod: params.get('nod') || '',
  q: '',
  pagina: 1,
  date: null,
};

function escapeHTML(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}
function formatPret(n, moneda) {
  const s = Number(n).toLocaleString(LIMBA === 'ro' ? 'ro-RO' : 'en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return `${s} ${moneda === 'RON' ? 'Lei' : escapeHTML(moneda || '')}`;
}
function arataToast(text) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2600);
}

if (DIN_CONFIGURATOR) {
  const inapoi = document.getElementById('link-inapoi');
  inapoi.href = `mydarrin-produs.html?slug=${encodeURIComponent(PARENT_SLUG)}&type=${encodeURIComponent(PARENT_TYPE)}`;
  inapoi.textContent = t('← Înapoi la configurare');
  document.getElementById('titlu-pagina').textContent = t('Alege materialul sau echipamentul');
  document.getElementById('context-sub').textContent = t('Produsul ales intră în prețul serviciului tău, cu TVA inclus.');
}

async function incarca() {
  const grid = document.getElementById('grid');
  const zonaMesaj = document.getElementById('mesaj');
  zonaMesaj.innerHTML = '';
  grid.setAttribute('aria-busy', 'true');
  const qs = new URLSearchParams({ tip: stare.tip, pagina: String(stare.pagina), lang: LIMBA, tara_cod: TARA });
  if (stare.nod) qs.set('nod', stare.nod);
  if (stare.q) qs.set('q', stare.q);
  try {
    const res = await fetch(`/api/public/marketplace-produse?${qs}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || t('Nu am putut încărca produsele.'));
    stare.date = data;
  } catch (e) {
    stare.date = null;
    grid.innerHTML = '';
    document.getElementById('noduri').innerHTML = '';
    document.getElementById('paginare').innerHTML = '';
    MDFeedback.mesaj(zonaMesaj, 'eroare', t(e.message) || t('Nu am putut încărca produsele.'));
    return;
  } finally {
    grid.removeAttribute('aria-busy');
  }
  randeaza();
}

function schimbaTab(tip) {
  stare.tip = tip;
  stare.nod = '';
  stare.pagina = 1;
  document.getElementById('tab-materiale').classList.toggle('active', tip === 'materiale');
  document.getElementById('tab-echipamente').classList.toggle('active', tip === 'echipamente');
  incarca();
}
function alegeNod(slug) {
  stare.nod = slug;
  stare.pagina = 1;
  incarca();
}
function mergiLaPagina(p) {
  stare.pagina = p;
  incarca().then(() => window.scrollTo({ top: 0, behavior: 'smooth' }));
}

function titluNod(n) {
  return LIMBA === 'en' && n.title_en ? escapeHTML(n.title_en) : `<span lang="ro">${escapeHTML(n.title)}</span>`;
}

function randeaza() {
  const d = stare.date;
  const grid = document.getElementById('grid');
  const noduriEl = document.getElementById('noduri');
  const paginare = document.getElementById('paginare');

  noduriEl.innerHTML = d.noduri.length
    ? `<button class="nod${stare.nod ? '' : ' active'}" onclick="alegeNod('')">${escapeHTML(t('Toate'))}</button>` +
      d.noduri.map((n) => `<button class="nod${stare.nod === n.slug ? ' active' : ''}" onclick="alegeNod('${escapeHTML(n.slug)}')">${titluNod(n)} (${n.numar})</button>`).join('')
    : '';

  if (!d.noduri.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">${escapeHTML(t('Produsele apar în curând.'))}</div>`;
    paginare.innerHTML = '';
    return;
  }
  if (!d.produse.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">${escapeHTML(stare.q ? t('Niciun rezultat pentru „{q}”.', { q: stare.q }) : t('Produsele apar în curând.'))}</div>`;
    paginare.innerHTML = '';
    return;
  }

  grid.innerHTML = d.produse.map((p, i) => cardProdus(p, i, d.moneda)).join('');
  const pagini = Math.max(1, Math.ceil(d.total / d.pe_pagina));
  paginare.innerHTML = pagini > 1
    ? `<button ${d.pagina <= 1 ? 'disabled' : ''} onclick="mergiLaPagina(${d.pagina - 1})">← ${escapeHTML(t('Înapoi'))}</button>
       <span>${escapeHTML(t('Pagina {p} din {n}', { p: d.pagina, n: pagini }))}</span>
       <button ${d.pagina >= pagini ? 'disabled' : ''} onclick="mergiLaPagina(${d.pagina + 1})">${escapeHTML(t('Înainte'))} →</button>`
    : '';
}

function cardProdus(p, i, moneda) {
  const lang = p.limba_text === 'ro' && LIMBA !== 'ro' ? ' lang="ro"' : '';
  const unitate = escapeHTML(t(p.unitate));
  const meta = [];
  if (p.tip === 'materiale') {
    if (p.stoc > 0) meta.push(t('În stoc: {n} {u}', { n: p.stoc, u: t(p.unitate) }));
    if (p.lead_time_zile > 0) meta.push(t('Livrare în {n} zile', { n: p.lead_time_zile }));
  } else {
    if (p.stoc > 0) meta.push(t('{n} bucăți disponibile', { n: p.stoc }));
    if (p.operator_inclus === 'cu_operator_optional') meta.push(t('Operator disponibil opțional'));
  }
  if (p.furnizor) meta.push(t('Furnizor: {f}', { f: p.furnizor }));
  const img = p.imagini[0]
    ? `<img class="card-img" id="img-${i}" src="${escapeHTML(p.imagini[0])}" alt="${escapeHTML(p.denumire)}" loading="lazy"/>`
    : '';
  const thumbs = p.imagini.length > 1
    ? `<div class="card-thumbs">${p.imagini.map((u) => `<img src="${escapeHTML(u)}" alt="" onclick="document.getElementById('img-${i}').src=this.src"/>`).join('')}</div>`
    : '';
  const actiuni = DIN_CONFIGURATOR
    ? `<button class="btn-select" onclick="adaugaLaServiciu(${i})">${escapeHTML(t('Adaugă la serviciu →'))}</button>`
    : `<input class="qty" type="number" min="1" step="1" value="1" id="qty-${i}" aria-label="${escapeHTML(t(p.tip === 'materiale' ? 'Cantitate' : 'Zile de închiriere'))}"/>
       <button class="btn-select" onclick="comanda(${i}, this)">${escapeHTML(t('Comandă'))}</button>`;
  return `
    <article class="card">
      ${img}${thumbs}
      <div class="card-title"${lang}>${escapeHTML(p.denumire)}</div>
      <div class="card-desc"${lang}>${escapeHTML(p.descriere)}</div>
      <div class="card-meta">${meta.map(escapeHTML).join(' · ')}</div>
      <div class="card-price">${formatPret(p.pret_cu_tva, moneda)} <span>/ ${unitate} · ${escapeHTML(t('TVA inclus'))}</span></div>
      <div class="card-actiuni">${actiuni}</div>
      <div id="msg-${i}"></div>
    </article>`;
}

// Din configurator: produsul revine în mydarrin-produs.html, care îl adaugă
// în selector și recalculează prețul serviciului pe server.
function adaugaLaServiciu(i) {
  const p = stare.date.produse[i];
  arataToast(t('„{p}” a fost ales — te ducem înapoi în configurator...', { p: p.denumire }));
  const dest = `mydarrin-produs.html?slug=${encodeURIComponent(PARENT_SLUG)}&type=${encodeURIComponent(PARENT_TYPE)}&addAddon=${encodeURIComponent(p.id)}`;
  setTimeout(() => { window.location.href = dest; }, 500);
}

// Direct: prețul real al comenzii (pragul minim de comandă inclus) vine de la
// server; checkout-ul trimite apoi doar id + cantitate (api/comenzi/creeaza.js).
async function comanda(i, buton) {
  const p = stare.date.produse[i];
  const zona = document.getElementById(`msg-${i}`);
  const qty = Number(document.getElementById(`qty-${i}`).value);
  if (!Number.isInteger(qty) || qty < 1) { MDFeedback.mesaj(zona, 'eroare', t('Alege o cantitate de cel puțin 1.')); return; }
  buton.disabled = true;
  zona.innerHTML = '';
  try {
    const res = await fetch('/api/public/marketplace-produse', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ produse: [{ id: p.id, qty }], tara_cod: TARA }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || t('Nu am putut calcula prețul.'));
    if (!data.disponibil) throw new Error(data.mesaj || t('Produsul nu mai este disponibil.'));
    const rand = { id: p.id, titlu: p.denumire, descriere: '', qty, pret: null };
    const config = {
      tip_comanda: 'marketplace', titlu: t('Produse din marketplace'), tier: '', tierLabel: '',
      materiale: p.tip === 'materiale' ? [rand] : [], inchirieri: p.tip === 'echipamente' ? [rand] : [],
      total: data.pret_final, tara_cod: TARA, salvat_la: Date.now(),
    };
    sessionStorage.setItem('myd_checkout_config', JSON.stringify(config));
    window.location.href = 'mydarrin-checkout.html';
  } catch (e) {
    buton.disabled = false;
    MDFeedback.mesaj(zona, 'eroare', t(e.message));
  }
}

let cautareTimer = null;
document.getElementById('cauta').addEventListener('input', (e) => {
  clearTimeout(cautareTimer);
  cautareTimer = setTimeout(() => { stare.q = e.target.value.trim(); stare.pagina = 1; incarca(); }, 300);
});

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('tab-materiale').classList.toggle('active', stare.tip === 'materiale');
  document.getElementById('tab-echipamente').classList.toggle('active', stare.tip === 'echipamente');
  incarca();
});
</script>

</body>
</html>
