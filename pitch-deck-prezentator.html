<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Presenter view · My Darrin</title>
<link rel="stylesheet" href="/pitch-deck.css">
<style>
/* Pasul 11-K3 (23 oct. 2026): fereastra prezentatorului. Nu are conținut
   propriu: deck-ul (cu notele) vine de la fereastra publicului care a
   deschis-o, prin canalul din adresă (?canal=…), doar între ferestrele
   aceleiași origini. Deschisă direct → mesaj cum se pornește. */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#0B1222;color:#fff;font-family:'Helvetica World','Helvetica Neue',Arial,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#pdp-prezentator{height:100vh;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
</style>
</head>
<body>
<div id="pdp-prezentator" data-i18n-skip></div>
<script src="/pitch-deck-render.js"></script>
<script src="/pitch-deck-prezentare.js"></script>
<script>window.MDPrezentare.fereastraPrezentator(document.getElementById('pdp-prezentator'));</script>
</body>
</html>
