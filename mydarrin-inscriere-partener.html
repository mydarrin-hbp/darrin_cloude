  - „Ce faci?”: Servicii · Materiale · Închirieri · Curier · Asigurări → profiles.rol_solicitat
    (partener_servicii, partener_materiale, partener_inchirieri, partener_curier, partener_asigurari);
  - Profesia (doar la Servicii): /api/public/profesii (competente_esco), preselectată din ?profesie=<slug>;

    (MDCont.inregistreaza / arataCod / salveazaPreinscriere), fără logică dublată;
  - după cod: panoul partenerului, starea „cont nou” (panou-cont-nou.js).
  Firma, IBAN-ul, profesiile și dotările, documentele și contractul rămân obligatorii,
  înainte de prima comandă acceptată (regulile din server nu se schimbă).
  Logica paginii: inscriere-partener.js.
-->
<style>

  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: clip; max-width: 100vw; }
  body { background: var(--fond); color: var(--text); font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  a { color: var(--albastru); }
  .pi-antet { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--chenar); }
  /* Pasul 12-P1b: logo-ul are dimensiunea lui și nu se comprimă în antet. */
  .pi-antet img { border-radius: 9px; display: block; flex: 0 0 auto; width: 34px; height: 34px; min-width: 34px; object-fit: contain; }
  .pi-marca { font-size: 16px; font-weight: 700; color: var(--albastru); flex-grow: 1; text-decoration: none; }
  .pi-intra { min-height: 44px; display: inline-flex; align-items: center; font-size: 13px; font-weight: 700; color: var(--albastru); background: none; border: 0; padding: 0 2px; cursor: pointer; font-family: inherit; text-decoration: none; }
  .pi-intra:hover { text-decoration: underline; }
  .pi-continut { max-width: 480px; margin: 0 auto; padding: 0 0 40px; }
  .pi-intro { padding: 20px 16px 8px; display: flex; flex-direction: column; gap: 6px; }
  .pi-eticheta { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--turcoaz-inchis); }
  .pi-intro h1 { margin: 0; font-size: 24px; font-weight: 800; line-height: 1.2; }
  .pi-intro p { margin: 0; font-size: 14px; line-height: 1.45; color: var(--gri); }
  form.pi-form { padding: 8px 16px 0; display: flex; flex-direction: column; gap: 12px; }
  .pi-camp { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; }
  .pi-camp input, .pi-camp select { height: 46px; border-radius: 12px; border: 1px solid var(--camp); background: #fff; padding: 0 12px; font-size: 15px; color: var(--text); font-family: inherit; width: 100%; }
  .pi-camp input:focus, .pi-camp select:focus { outline: 3px solid rgba(0,51,102,.18); border-color: var(--albastru); }
  .pi-ajutor { font-size: 12px; font-weight: 400; color: var(--gri); }
  .pi-rand { display: flex; gap: 10px; } .pi-rand > * { flex: 1 1 0; min-width: 0; }
  fieldset.pi-ce { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  fieldset.pi-ce legend { font-size: 13px; font-weight: 700; padding: 0; margin-bottom: 6px; }
  .pi-cipuri { display: flex; flex-wrap: wrap; gap: 6px; }
  .pi-cip { position: relative; }
  .pi-cip input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .pi-cip span { min-height: 44px; padding: 0 11px; border-radius: 99px; border: 1px solid var(--camp); background: #fff; color: var(--text); font-size: 13px; display: inline-flex; align-items: center; cursor: pointer; }
  .pi-cip input:checked + span { border: 2px solid var(--albastru); background: #EAF1F8; color: var(--albastru); font-weight: 700; padding: 0 10px; }
  .pi-cip input:focus-visible + span { outline: 3px solid #0E9E99; outline-offset: 2px; }
  .pi-gdpr { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.4; }
  .pi-gdpr input { width: 22px; height: 22px; margin: 0; flex-shrink: 0; accent-color: var(--albastru); }
  .pi-buton { min-height: 52px; border: none; border-radius: 14px; background: var(--portocaliu); color: #1A1A1A; font-size: 16px; font-weight: 800; cursor: pointer; font-family: inherit; }
  .pi-buton:disabled { opacity: .8; cursor: default; }
  .pi-nota { text-align: center; font-size: 12.5px; color: var(--gri); margin: 0; }
  /* Pasul 12-P1b: logarea, vizibilă sub butonul portocaliu. */
  .pi-am-cont { text-align: center; font-size: 14px; color: var(--gri); margin: 0; }
  .pi-am-cont button { background: none; border: 0; padding: 0 4px; min-height: 44px; font: inherit; font-size: 14px; font-weight: 700; color: var(--albastru); text-decoration: underline; cursor: pointer; }
  [hidden] { display: none !important; }
  /* Selectorul de limbă (cont-dashboard.js): pe telefon, doar codul limbii, ca în machetă. */
  @media (max-width: 480px) { #pi-limba .myd-limba-nume { display: none; } #pi-limba .myd-limba-cod { display: inline; } }
  @media (min-width: 768px) { .pi-antet { padding: 14px 32px; } .pi-continut { padding-top: 16px; } }

<body>
<header class="pi-antet">
  <img src="/assets/img/logo-my-darrin.webp" alt="My Darrin" width="34" height="34">
  <a class="pi-marca" href="/">My Darrin</a>
  <span id="pi-limba"></span>
  <button type="button" class="pi-intra" id="pi-intra">Intră în cont</button>
</header>

<main class="pi-continut">
  <div class="pi-intro">
    <span class="pi-eticheta">CONT DE PARTENER · GRATUIT</span>
    <h1>Primește comenzi în zona ta</h1>
    <p>Creezi contul în 60 de secunde. Firma, contul bancar și documentele le completezi mai târziu, înainte de prima comandă.</p>
  </div>

  <form class="pi-form" id="pi-form" novalidate>
    <fieldset class="pi-ce">
      <legend>Ce faci?</legend>
      <div class="pi-cipuri" id="pi-categorii">
        <label class="pi-cip"><input type="radio" name="pi-categorie" value="servicii"><span>Servicii</span></label>
        <label class="pi-cip"><input type="radio" name="pi-categorie" value="materiale"><span>Materiale</span></label>
        <label class="pi-cip"><input type="radio" name="pi-categorie" value="inchirieri"><span>Închirieri</span></label>
        <label class="pi-cip"><input type="radio" name="pi-categorie" value="curier"><span>Curier</span></label>
        <label class="pi-cip"><input type="radio" name="pi-categorie" value="asigurari"><span>Asigurări</span></label>
      </div>
    </fieldset>

    <label class="pi-camp" id="pi-profesie-camp">Profesia
      <select id="pi-profesie" aria-describedby="pi-profesie-ajutor">
        <option value="">Alege profesia</option>
      </select>
      <span class="pi-ajutor" id="pi-profesie-ajutor" hidden>Aleasă deja din reclamă; o poți schimba.</span>
    </label>

    <label class="pi-camp">Orașul în care lucrezi
      <input id="pi-oras" autocomplete="address-level2" maxlength="80" required>
    </label>

    <div class="pi-rand">
      <label class="pi-camp">Prenume
        <input id="pi-prenume" autocomplete="given-name" maxlength="60" required>
      </label>
      <label class="pi-camp">Nume
        <input id="pi-nume" autocomplete="family-name" maxlength="60" required>
      </label>
    </div>

    <label class="pi-camp">Telefon
      <input id="pi-tel" type="tel" inputmode="tel" autocomplete="tel" maxlength="24" placeholder="+40 7xx xxx xxx" required>
    </label>

    <label class="pi-camp">Email
      <input id="pi-email" type="email" inputmode="email" autocomplete="email" maxlength="254" placeholder="nume@gmail.com" required>
    </label>

    <label class="pi-camp">Parola
      <input id="pi-parola" type="password" autocomplete="new-password" minlength="8" required aria-describedby="pi-parola-ajutor">
      <span class="pi-ajutor" id="pi-parola-ajutor">Minimum 8 caractere.</span>
    </label>

    <label class="pi-gdpr">
      <input type="checkbox" id="pi-gdpr" required>
      <span>Accept <a href="/termeni" target="_blank" rel="noopener">Termenii și condițiile</a> și <a href="/confidentialitate" target="_blank" rel="noopener">Politica de confidențialitate</a>.</span>
    </label>

    <button type="submit" class="pi-buton" id="pi-trimite">Creează cont de partener</button>
    <p class="pi-am-cont" id="pi-am-cont">Ai deja cont? <button type="button" id="pi-intra-jos">Intră în cont</button></p>
    <div id="pi-msg"></div>
    <div id="pi-recuperare"></div>
    <p class="pi-nota" id="pi-nota">Primești un cod pe email · 0% comision din manoperă</p>
  </form>
</main>

<script src="/cont-fereastra.js" defer></script>
<script src="/inscriere-partener.js" defer></script>
</body>
